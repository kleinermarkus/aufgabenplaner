      const getPersonAvailabilityDetails = (person, slotId, locationId, dateStr, groupIds) => {
        const slot = timeSlots.find(s => s.id === slotId);
        if (!slot) return { isAvailable: false, reason: 'Ungültiger Zeitslot' };

        if (Array.isArray(groupIds) && groupIds.length > 0) {
          const isMember = groupIds.some(gid => groups.find(g => g.id === gid)?.personIds?.includes(person.id));
          if (!isMember) return { isAvailable: false, reason: 'Nicht in relevanter Gruppe' };
        }

        const isAbsent = person.absences?.some(abs => dateStr >= abs.start && dateStr <= abs.end);
        if (isAbsent) return { isAvailable: false, reason: 'Abwesend/Urlaub' };

        const shiftBlock = getExternalShiftBlock(person, dateStr, slot.time);
        if (shiftBlock) {
          return { isAvailable: false, reason: `Schicht: ${shiftBlock}` };
        }

        // Wer an einem Tag einem Gruppentermin zugeteilt ist, wird an dem Tag nicht für allgemeine Termine eingeteilt
        if (!Array.isArray(groupIds) || groupIds.length === 0) {
          const busyWithGroup = schedule.some(t => t.dateStr === dateStr && t.assignedPersonId === person.id && Array.isArray(t.groupIds) && t.groupIds.length > 0);
          if (busyWithGroup) return { isAvailable: false, reason: 'Gruppentermin an diesem Tag' };
        }

        const matchSlot = timeSlots.find(s => s.dayOfWeek === slot.dayOfWeek && s.time === slot.time);
        if (!matchSlot) return { isAvailable: false, reason: 'Kein passender Slot' };

        const matrixKey = `${matchSlot.id}_${locationId}`;
        const isQualified = !!person.matrix?.[matrixKey];
        if (!isQualified) return { isAvailable: false, reason: 'Nicht für diesen Ort/Zeitslot qualifiziert' };

        return { isAvailable: true, reason: 'Verfügbar' };
      };

      // Einsatz-Bilanz aufbauen (optional eine Aufgabe ausschließen, z. B. die bewertete selbst)
      const buildAssignmentStats = (scheduleList, peopleList, excludeTaskId) => {
        const counts = {};
        const weekdayCounts = {};
        const dates = {};
        peopleList.forEach(p => {
          counts[p.id] = 0;
          weekdayCounts[p.id] = {};
          for (let i = 0; i < 7; i++) weekdayCounts[p.id][i] = 0;
          dates[p.id] = [];
        });
        scheduleList.forEach(t => {
          if (!t.assignedPersonId || t.id === excludeTaskId || counts[t.assignedPersonId] === undefined) return;
          // Gruppen-Termine: außer Konkurrenz (Standard) oder in die Bilanz einbezogen (Einstellung in den Stammdaten)
          if (Array.isArray(t.groupIds) && t.groupIds.length > 0 && !settings.groupsCountInStats) return;
          counts[t.assignedPersonId]++;
          const wDay = parseLocalDate(t.dateStr).getDay();
          weekdayCounts[t.assignedPersonId][wDay] = (weekdayCounts[t.assignedPersonId][wDay] || 0) + 1;
          dates[t.assignedPersonId].push(t.dateStr);
        });
        Object.values(dates).forEach(list => list.sort());
        return { counts, weekdayCounts, dates };
      };

      // Fair-Sortierung: 1. längste Pause, 2. weniger Gesamteinsätze, 3. Wochentags-Balance, 4. alphabetisch
      const sortCandidatesByFairness = (candidates, task, stats) => {
        const taskDate = parseLocalDate(task.dateStr);
        const taskWDay = taskDate.getDay();
        // Pause = Abstand zur NÄCHSTEN Einteilung – davor oder danach; manuelle Vormerkungen
        // in der Zukunft zählen damit genauso wie zurückliegende Einsätze
        const pauseDays = (id) => {
          let best = Infinity;
          (stats.dates[id] || []).forEach(d => {
            const diff = Math.abs((taskDate - parseLocalDate(d)) / 86400000);
            if (diff < best) best = diff;
          });
          return best;
        };
        return [...candidates].sort((a, b) => {
          const daysA = pauseDays(a.id);
          const daysB = pauseDays(b.id);
          if (daysA !== daysB) return daysB - daysA;

          const diffCount = stats.counts[a.id] - stats.counts[b.id];
          if (diffCount !== 0) return diffCount;

          const diffWDay = (stats.weekdayCounts[a.id][taskWDay] || 0) - (stats.weekdayCounts[b.id][taskWDay] || 0);
          if (diffWDay !== 0) return diffWDay;

          return a.name.localeCompare(b.name, 'de');
        });
      };

      // Kontext für den Assistenten: kompakte deutsche Zusammenfassung des Planungsstands zum gewählten Tag
      const buildAssistantContext = (dateStr) => {
        const d = parseLocalDate(dateStr);
        const stats = buildAssignmentStats(schedule, people, null);
        const dayTasks = schedule.filter(t => t.dateStr === dateStr);
        const lines = [];
        lines.push(`Datum: ${DAY_NAMES[d.getDay()]}, ${d.toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' })} (${dateStr})`);
        if (holidays[dateStr]) lines.push(`Feiertag: ${holidays[dateStr]}`);
        (eventsByDate[dateStr] || []).forEach(ev => lines.push(`Ereignis: ${ev.title}${ev.time ? ' ' + ev.time : ''}${ev.note ? ' (' + ev.note + ')' : ''}`));
        lines.push('');
        lines.push(`Termine des Tages (${dayTasks.length}):`);
        dayTasks.forEach(t => {
          const loc = locations.find(l => l.id === t.locationId);
          const slot = timeSlots.find(s => s.id === t.slotId);
          const person = people.find(p => p.id === t.assignedPersonId);
          const gNames = (t.groupIds || []).map(gid => groups.find(g => g.id === gid)?.name).filter(Boolean);
          lines.push(`- ${slot?.time || '?'} Uhr @ ${loc?.name || 'Ort'}${gNames.length ? ' [Gruppentermin: ' + gNames.join(', ') + ']' : ''}: ${person ? person.name + ' eingeteilt (' + (t.assignedBy === 'manual' ? 'manuell' : 'automatisch') + ')' : 'OFFEN - niemand eingeteilt'}`);
        });
        lines.push('');
        lines.push('Personen (Bilanz = Einteilungen gesamt ohne Gruppentermine, Pause = Abstand in Tagen zur nächsten Einteilung davor oder danach):');
        const daysBetween = (a, b) => Math.round(Math.abs((parseLocalDate(b) - parseLocalDate(a)) / 86400000));
        people.forEach(p => {
          const cnt = stats.counts[p.id] || 0;
          const ds = stats.dates[p.id] || [];
          const prev = ds.filter(x => x <= dateStr).pop();
          const next = ds.find(x => x > dateStr);
          const pauses = [];
          if (prev !== undefined) pauses.push(daysBetween(prev, dateStr));
          if (next !== undefined) pauses.push(daysBetween(dateStr, next));
          const pause = pauses.length === 0 ? null : Math.min(...pauses);
          const abs = (p.absences || []).filter(a => a.end >= dateStr).slice(0, 3).map(a => a.start === a.end ? a.start : `${a.start} bis ${a.end}`).join(', ');
          const shift = p.shiftRotation?.startDate ? `Schichtrhythmus ab ${p.shiftRotation.startDate}` : '';
          lines.push(`- ${p.name}: Bilanz ${cnt}, Pause ${pause === null ? 'keine Einteilung' : pause + ' Tage'}${prev ? `, letzte Einteilung ${prev}` : ''}${next ? `, nächste Einteilung ${next}` : ''}${abs ? `, Abwesenheiten: ${abs}` : ''}${shift ? `, ${shift}` : ''}`);
          dayTasks.forEach(t => {
            const det = getPersonAvailabilityDetails(p, t.slotId, t.locationId, dateStr, t.groupIds);
            const slot = timeSlots.find(s => s.id === t.slotId);
            const loc = locations.find(l => l.id === t.locationId);
            lines.push(`  · ${slot?.time || '?'} Uhr @ ${loc?.name || 'Ort'}: ${det.isAvailable ? 'verfügbar' : 'nicht verfügbar (' + det.reason + ')'}`);
          });
        });
        return lines.join('\n');
      };

      // Verständliche Fehlermeldungen für typische WebGPU-/Engine-Probleme
      const friendlyAiError = (msg) => {
        const m = String(msg || '');
        if (/compatible GPU|no GPU|GPU not|WebGPU is not/i.test(m)) {
          return 'WebGPU ist gerade nicht verfügbar. Nach einem GPU-Fehler sperrt der Browser die Schnittstelle meist bis zum Neustart – bitte den Browser komplett schließen und neu öffnen. Falls es dann immer noch nicht geht: unter webgpureport.org prüfen, ob WebGPU unterstützt wird.';
        }
        if (/already been disposed|unmapped|GPUBuffer|device lost/i.test(m)) {
          return 'Die Verbindung des Modells zur GPU wurde zwischenzeitlich getrennt (typisch nach einem Grafiktreiber-Fehler). Bitte „Modell laden“ erneut drücken und die Frage noch einmal stellen – hilft das nicht, den Browser einmal komplett neu starten.';
        }
        return m;
      };

      const loadAssistantModel = async () => {
        if (!navigator.gpu) { setAiPhase('nogpu'); return; }
        if (aiEngineRef.current && aiLoadedModelRef.current === aiModelId) { setAiPhase('ready'); return; }
        if (aiEngineRef.current) {
          try { aiEngineRef.current.unload(); } catch (err) {}
          aiEngineRef.current = null;
        }
        setAiPhase('loading'); setAiProgress(0); setAiNote('Bibliothek wird geladen…');
        try {
          const webllm = await import('./webllm-0.2.88.min.js');
          const engine = await webllm.CreateMLCEngine(aiModelId, {
            initProgressCallback: (r) => { setAiProgress(r.progress || 0); setAiNote(r.text || ''); }
          });
          aiEngineRef.current = engine;
          aiLoadedModelRef.current = aiModelId;
          setAiPhase('ready'); setAiNote('');
        } catch (err) {
          console.error(err);
          setAiPhase('error');
          setAiNote(friendlyAiError(String(err?.message || err)));
        }
      };

      const askAssistant = async (question) => {
        const q = (question || aiInput).trim();
        if (!q || aiBusyRef.current || aiPhase !== 'ready') return;
        aiBusyRef.current = true;
        setAiInput('');
        setAiBusy(true);
        const history = [...aiMessages, { role: 'user', content: q }];
        setAiMessages([...history, { role: 'assistant', content: '' }]);
        let watchdog = null;
        try {
          const prior = history
            .slice(0, -1)
            .slice(-6)
            .filter(m => m.content && String(m.content).trim() && !String(m.content).startsWith('Fehler:'))
            .map(m => ({ role: m.role, content: m.content }));
          const messages = [
            { role: 'system', content: ASSISTANT_SYSTEM_PROMPT },
            ...prior,
            { role: 'user', content: q + '\n\n[Aktueller Datenstand]\n' + buildAssistantContext(selectedDateStr) }
          ];
          let reply = '';
          let lastActivity = Date.now();
          watchdog = setInterval(() => {
            if (Date.now() - lastActivity > 60000) {
              try { aiEngineRef.current.interruptGenerate(); } catch (err) {}
            }
          }, 5000);
          const chunks = await aiEngineRef.current.chat.completions.create({ messages, stream: true, stream_options: { include_usage: true }, temperature: 0.3, max_tokens: 500 });
          for await (const chunk of chunks) {
            const delta = chunk.choices?.[0]?.delta?.content || '';
            if (delta) {
              lastActivity = Date.now();
              reply += delta;
              setAiMessages(prev => { const cp = prev.slice(); cp[cp.length - 1] = { role: 'assistant', content: reply }; return cp; });
              if (aiChatRef.current) aiChatRef.current.scrollTop = aiChatRef.current.scrollHeight;
            }
          }
          if (!reply.trim()) {
            setAiMessages(prev => { const cp = prev.slice(); cp[cp.length - 1] = { role: 'assistant', content: 'Fehler: Keine Antwort erhalten. Bitte die Frage erneut stellen.' }; return cp; });
          }
        } catch (err) {
          console.error(err);
          setAiMessages(prev => { const cp = prev.slice(); cp[cp.length - 1] = { role: 'assistant', content: 'Fehler: ' + friendlyAiError(err?.message || err) }; return cp; });
        } finally {
          if (watchdog) clearInterval(watchdog);
          aiBusyRef.current = false;
          setAiBusy(false);
        }
      };

      const assistantSuggestions = useMemo(() => {
        const stats = buildAssignmentStats(schedule, people, null);
        const dayTasks = schedule.filter(t => t.dateStr === selectedDateStr);
        const out = [];
        const openTask = dayTasks.find(t => !t.assignedPersonId);
        if (openTask) {
          const loc = locations.find(l => l.id === openTask.locationId);
          const slot = timeSlots.find(s => s.id === openTask.slotId);
          out.push(`Warum ist für "${loc?.name || 'Ort'}" um ${slot?.time || '?'} Uhr niemand eingeteilt?`);
        }
        const never = people.find(p => !stats.counts[p.id]);
        if (never) out.push(`Warum wurde ${never.name} bisher nicht eingeteilt?`);
        out.push(`Wer ist am ${parseLocalDate(selectedDateStr).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' })} verfügbar und warum?`);
        return out;
      }, [schedule, people, locations, timeSlots, selectedDateStr]);

      const getRecommendedPersonIdForTask = (task) => {
        const candidates = people.filter(p => {
          const details = getPersonAvailabilityDetails(p, task.slotId, task.locationId, task.dateStr, task.groupIds);
          return details.isAvailable;
        });
        if (candidates.length === 0) return null;
        const stats = buildAssignmentStats(schedule, people, task.id);
        return sortCandidatesByFairness(candidates, task, stats)[0].id;
      };

      // 1. Termine generieren (Vollständige Kalenderwochen einbeziehen + Duplikatsprüfung)
      const generateDates = () => {
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        // Starte am Montag der ersten Kalenderwoche des Monats
        let start = new Date(firstDay);
        let dayOfWeek = start.getDay();
        let distanceToMon = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
        start.setDate(start.getDate() - distanceToMon);

        // Ende am Sonntag der letzten Kalenderwoche des Monats
        let end = new Date(lastDay);
        dayOfWeek = end.getDay();
        let distanceToSun = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
        end.setDate(end.getDate() + distanceToSun);

        const newTasks = [];
        const updates = new Map();
        let curr = new Date(start);

        while (curr <= end) {
          const dateStr = toLocalDateStr(curr);

          const groupScope = (ids) => Array.isArray(ids) ? [...ids].sort().join(',') : '';
          const timeOf = (t) => { const s = timeSlots.find(x => x.id === t.slotId); return s ? s.time : null; };
          const matches = patterns
            .map(pat => ({ pat, slot: timeSlots.find(s => s.id === pat.slotId) }))
            .filter(m => m.slot && patternMatchesDate(m.pat, curr, m.slot));

          if (matches.length > 0) {
            const wantedKeys = new Set(matches.map(m => `${m.slot.time}|${groupScope(m.pat.groupIds)}`));
            const matchTimes = [...new Set(matches.map(m => m.slot.time))];
            const satisfied = new Set();
            const created = new Set();

            // Bestehende automatisch generierte Termine an diesem Tag mit den aktuellen
            // Mustern abgleichen – veraltete Stände werden übernommen statt doppelt angelegt
            schedule
              .filter(t => t.dateStr === dateStr && t.isManual !== true && (matchTimes.includes(timeOf(t)) || timeOf(t) === null))
              .forEach(t => {
                const tTime = timeOf(t);
                const sc = groupScope(t.groupIds);
                if (tTime !== null && wantedKeys.has(`${tTime}|${sc}`)) {
                  satisfied.add(`${tTime}|${sc}`);
                  return;
                }
                const target = tTime === null
                  ? matches.find(mm => groupScope(mm.pat.groupIds) === sc && !satisfied.has(`${mm.slot.time}|${sc}`))
                  : matches.find(mm => {
                      const k = `${mm.slot.time}|${groupScope(mm.pat.groupIds)}`;
                      return !satisfied.has(k) && !created.has(k);
                    });
                if (target) {
                  updates.set(t.id, {
                    slotId: target.pat.slotId,
                    locationId: target.pat.locationId,
                    groupIds: Array.isArray(target.pat.groupIds) ? [...target.pat.groupIds] : []
                  });
                  satisfied.add(`${target.slot.time}|${groupScope(target.pat.groupIds)}`);
                }
              });

            matches.forEach(m => {
              const pat = m.pat;
              const slot = m.slot;
              const patScope = groupScope(pat.groupIds);
              const key = `${slot.time}|${patScope}`;
              if (satisfied.has(key) || created.has(key)) return;
              const sameTime = (t) => {
                if (t.dateStr !== dateStr) return false;
                if (groupScope(t.groupIds) !== patScope) return false;
                if (t.slotId === pat.slotId && t.locationId === pat.locationId) return true;
                const tSlot = timeSlots.find(s => s.id === t.slotId);
                return !!tSlot && tSlot.time === slot.time;
              };
              const exists = schedule.some(sameTime) || newTasks.some(sameTime);
              if (!exists) {
                newTasks.push({
                  id: `task-${dateStr}-${pat.slotId}-${pat.locationId}${patScope ? '-grp-' + patScope.replace(/,/g, '-') : ''}`,
                  dateStr,
                  slotId: pat.slotId,
                  locationId: pat.locationId,
                  groupIds: Array.isArray(pat.groupIds) ? pat.groupIds : [],
                  assignedPersonId: null,
                  isManual: false,
                  updatedAt: Date.now()
                });
                created.add(key);
              } else {
                satisfied.add(key);
              }
            });
          }

          curr.setDate(curr.getDate() + 1);
        }

        const applyUpdates = (prev) => prev.map(t => {
          const u = updates.get(t.id);
          return u ? { ...t, slotId: u.slotId, locationId: u.locationId, ...(u.groupIds ? { groupIds: u.groupIds } : {}), updatedAt: Date.now() } : t;
        });

        if (newTasks.length > 0) {
          const existingById = new Map(schedule.map(t => [t.id, t]));
          const uniqueNew = [];
          newTasks.forEach(t => {
            const ex = existingById.get(t.id);
            if (!ex) { existingById.set(t.id, t); uniqueNew.push(t); return; }
            const exScope = Array.isArray(ex.groupIds) ? [...ex.groupIds].sort().join(',') : '';
            const tScope = Array.isArray(t.groupIds) ? [...t.groupIds].sort().join(',') : '';
            if (exScope === tScope) return;
            let altId = t.id, n = 2;
            while (existingById.has(altId)) { altId = `${t.id}-${n}`; n++; }
            t.id = altId;
            existingById.set(altId, t);
            uniqueNew.push(t);
          });
          setSchedule(prev => [...applyUpdates(prev), ...uniqueNew]);
          showToast(`${uniqueNew.length} neue Termine generiert (vollständige KW berücksichtigt)${updates.size > 0 ? `, ${updates.size} bestehende Termine an aktuelle Muster angepasst` : ''}.`, 'success');
        } else if (updates.size > 0) {
          setSchedule(applyUpdates);
          showToast(`${updates.size} bestehende Termine an die aktuellen Muster angepasst (Doppel-Termine verhindert).`, 'success');
        } else {
          showToast('Keine neuen Termine generiert (alle passenden Termine existieren bereits).', 'info');
        }
      };

      // 2. Personen zuteilen
      const assignPeople = () => {
        let updatedSchedule = [...schedule];

        // 1. Termine chronologisch sortieren für korrekte zeitliche Abstands- und Wochentags-Berechnung
        updatedSchedule.sort((a, b) => {
          if (a.dateStr !== b.dateStr) return a.dateStr.localeCompare(b.dateStr);
          const sA = timeSlots.find(s => s.id === a.slotId)?.time || '';
          const sB = timeSlots.find(s => s.id === b.slotId)?.time || '';
          return sA.localeCompare(sB);
        });

        let unassigned = updatedSchedule.filter(t => !t.assignedPersonId);
        if (unassigned.length === 0) {
          showToast('Keine unbesetzten Aufgaben vorhanden.', 'info');
          return;
        }

        // Fairness-Statistiken: alle vorhandenen Einteilungen zählen – Vergangenheit und Zukunft,
        // manuell und automatisch; Gruppentermine nur bei eingeschalteter Einstellung
        const stats = buildAssignmentStats([], people, null, null);
        updatedSchedule.forEach(t => {
          if (Array.isArray(t.groupIds) && t.groupIds.length > 0 && !settings.groupsCountInStats) return;
          if (t.assignedPersonId && stats.counts[t.assignedPersonId] !== undefined) {
            stats.counts[t.assignedPersonId]++;
            const wDay = parseLocalDate(t.dateStr).getDay();
            stats.weekdayCounts[t.assignedPersonId][wDay] = (stats.weekdayCounts[t.assignedPersonId][wDay] || 0) + 1;
            stats.dates[t.assignedPersonId].push(t.dateStr);
          }
        });
        Object.values(stats.dates).forEach(list => list.sort());

        // Wer an einem Tag einen Gruppentermin hat, wird an dem Tag nicht für allgemeine Termine eingeteilt
        const groupBusyDates = {};
        updatedSchedule.forEach(t => {
          if (t.assignedPersonId && Array.isArray(t.groupIds) && t.groupIds.length > 0) (groupBusyDates[t.assignedPersonId] = groupBusyDates[t.assignedPersonId] || []).push(t.dateStr);
        });

        let assignedCount = 0;
        let autoGroupCount = 0;
        updatedSchedule = updatedSchedule.map(task => {
          if (task.assignedPersonId) return task;
          const isGroupTask = Array.isArray(task.groupIds) && task.groupIds.length > 0;
          // Gruppen-Termine: außer Konkurrenz nur manuell – oder automatisch, wenn in den Stammdaten eingeschaltet
          if (isGroupTask && !settings.autoAssignGroups) return task;

          const candidates = people.filter(p => {
            const details = getPersonAvailabilityDetails(p, task.slotId, task.locationId, task.dateStr, task.groupIds);
            if (!details.isAvailable) return false;
            if ((groupBusyDates[p.id] || []).includes(task.dateStr)) return false;
            return true;
          });

          if (candidates.length > 0) {
            const chosen = sortCandidatesByFairness(candidates, task, stats)[0];
            const taskWDay = parseLocalDate(task.dateStr).getDay();
            if (isGroupTask) {
              (groupBusyDates[chosen.id] = groupBusyDates[chosen.id] || []).push(task.dateStr);
              autoGroupCount++;
            }
            stats.counts[chosen.id]++;
            stats.weekdayCounts[chosen.id][taskWDay] = (stats.weekdayCounts[chosen.id][taskWDay] || 0) + 1;
            stats.dates[chosen.id].push(task.dateStr);
            assignedCount++;
            return { ...task, assignedPersonId: chosen.id, assignedBy: 'auto', updatedAt: Date.now() };
          }
          return task;
        });

        setSchedule(updatedSchedule);
        showToast(`${assignedCount} Aufgaben zugeteilt – längste Pause zuerst, dann Gesamtbilanz und Wochentags-Balance.` + (autoGroupCount > 0 ? ` Davon ${autoGroupCount} Gruppentermine.` : ''), 'success');
      };

      // PDF Drucken / Exportieren
      
      // Alle Termine löschen
      
      // Alle Daten komplett löschen (Stammdaten, Muster, Personen, Termine)
      
      // Komplette App als HTML-Datei herunterladen
      const handleDownloadAppHtml = () => {
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'aufgabenplaner.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('HTML-Datei erfolgreich heruntergeladen!', 'success');
      };

      const handleClearAllData = () => {
        if (confirm('ACHTUNG: Möchten Sie wirklich ALLE Daten (Orte, Zeitslots, Muster, Personen, Abwesenheiten und Termine) unwiderruflich löschen und auf den Neuzustand zurücksetzen?')) {
          localStorage.clear();
          setLocations(INITIAL_LOCATIONS);
          setTimeSlots(INITIAL_SLOTS);
          setPatterns(INITIAL_PATTERNS);
          setGroups(INITIAL_GROUPS);
          setPeople(INITIAL_PEOPLE);
          setSchedule([]);
          setTombstones(normalizeTombstones(null));
          showToast('Alle Daten wurden vollständig zurückgesetzt.', 'success');
        }
      };

      const monthNameStr = currentDate.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

      const handleClearAllSchedule = () => {
        if (confirm(`Möchten Sie wirklich alle generierten Termine für ${monthNameStr} löschen?`)) {
          schedule.forEach(t => {
            const d = parseLocalDate(t.dateStr);
            if (d.getFullYear() === year && d.getMonth() === month) markDeleted('schedule', t.id);
          });
          setSchedule(schedule.filter(t => {
            const d = parseLocalDate(t.dateStr);
            return !(d.getFullYear() === year && d.getMonth() === month);
          }));
          showToast(`Alle Termine für ${monthNameStr} gelöscht.`, 'success');
        }
      };

      // Alle Zuteilungen für den aktuellen Monat zurücksetzen
      const handleClearAllAssignments = () => {
        if (confirm(`Möchten Sie wirklich alle Personenzuteilungen für ${monthNameStr} zurücksetzen?`)) {
          setSchedule(schedule.map(t => {
            const d = parseLocalDate(t.dateStr);
            if (d.getFullYear() === year && d.getMonth() === month) {
              return { ...t, assignedPersonId: null, assignedBy: null, updatedAt: Date.now() };
            }
            return t;
          }));
          showToast(`Zuteilungen für ${monthNameStr} zurückgesetzt.`, 'success');
        }
      };

      // Ort hinzufügen
      const handleAddLocation = (e) => {
        e.preventDefault();
        if (!newLocName.trim()) return;
        const newLoc = { id: `loc-${Date.now()}`, name: newLocName.trim() };
        setLocations([...locations, newLoc]);
        setNewLocName('');
        showToast(`Ort "${newLoc.name}" angelegt.`, 'success');
      };

      // Zeitslot hinzufügen
      const handleAddSlot = (e) => {
        e.preventDefault();
        const day = parseInt(newSlotDay, 10);
        const newSlot = { id: `slot-${Date.now()}`, dayOfWeek: day, time: newSlotTime };
        setTimeSlots([...timeSlots, newSlot]);
        showToast(`Zeitslot (${DAY_NAMES[day]} ${newSlotTime}) angelegt.`, 'success');
      };

      // Muster hinzufügen
      const handleAddPattern = (e) => {
        e.preventDefault();
        if (!newPatSlot || !newPatLoc) {
          showToast('Bitte Zeitslot und Ort auswählen.', 'error');
          return;
        }
        const newPat = {
          id: `pat-${Date.now()}`,
          slotId: newPatSlot,
          locationId: newPatLoc,
          frequency: newPatFreq,
          weekParity: newPatFreq === 'biweekly' ? newPatParity : null,
          monthlyMode: newPatFreq === 'monthly' ? newPatMonthlyMode : null,
          monthlyDay: newPatFreq === 'monthly' && newPatMonthlyMode === 'dayOfMonth' ? parseInt(newPatMonthlyDay, 10) || 1 : null,
          monthlyWeek: newPatFreq === 'monthly' && newPatMonthlyMode === 'nthWeekday' ? (parseInt(newPatMonthlyWeek, 10) || newPatMonthlyWeek) : null,
          monthlyWeekDay: newPatFreq === 'monthly' && newPatMonthlyMode === 'nthWeekday' ? parseInt(newPatMonthlyWeekDay, 10) : null,
          groupIds: [...newPatGroupIds],
          updatedAt: Date.now()
        };
        setPatterns([...patterns, newPat]);
        setNewPatGroupIds([]);
        showToast('Wiederkehrendes Muster angelegt.', 'success');
      };

      // Gruppe anlegen
      const handleAddGroup = (e) => {
        e.preventDefault();
        const trimmed = newGroupName.trim();
        if (!trimmed) return;
        if (groups.some(g => g.name.toLowerCase() === trimmed.toLowerCase())) {
          showToast('Gruppe existiert bereits!', 'error');
          return;
        }
        setGroups([...groups, { id: `grp-${Date.now()}`, name: trimmed, personIds: [], updatedAt: Date.now() }]);
        setNewGroupName('');
        showToast('Gruppe angelegt.', 'success');
      };

      const toggleGroupMember = (groupId, personId) => {
        setGroups(groups.map(g => g.id === groupId ? {
          ...g,
          personIds: g.personIds?.includes(personId) ? g.personIds.filter(id => id !== personId) : [...(g.personIds || []), personId],
          updatedAt: Date.now()
        } : g));
      };

      // Gruppe löschen: Referenzen in Terminen und Mustern entfernen
      const handleDeleteGroup = (groupId) => {
        markDeleted('groups', groupId);
        setGroups(groups.filter(g => g.id !== groupId));
        setSchedule(prev => prev.map(t => t.groupIds?.includes(groupId) ? { ...t, groupIds: t.groupIds.filter(x => x !== groupId), updatedAt: Date.now() } : t));
        setPatterns(prev => prev.map(p => p.groupIds?.includes(groupId) ? { ...p, groupIds: p.groupIds.filter(x => x !== groupId) } : p));
        showToast('Gruppe gelöscht.', 'success');
      };

      // Person hinzufügen
      const handleAddPerson = (e) => {
        e.preventDefault();
        const trimmed = newPersonName.trim();
        if (!trimmed) return;
        if (people.some(p => p.name.toLowerCase() === trimmed.toLowerCase())) {
          showToast('Person existiert bereits!', 'error');
          return;
        }
        const newPerson = {
          id: `p-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
          name: trimmed,
          absences: [],
          matrix: {},
          shiftRotation: null
        };
        setPeople([...people, newPerson]);
        setNewPersonName('');
        showToast(`Person "${trimmed}" hinzugefügt.`, 'success');
      };

      // Manuelles Hinzufügen einer Abwesenheit
      const handleAddManualAbsence = (personId, e) => {
        e.preventDefault();
        const data = manualAbsence[personId];
        if (!data || !data.start || !data.end) {
          showToast('Bitte Start- und Enddatum auswählen.', 'error');
          return;
        }
        if (data.start > data.end) {
          showToast('Startdatum darf nicht nach Enddatum liegen.', 'error');
          return;
        }

        setPeople([...people].sort((a, b) => a.name.localeCompare(b.name, 'de')).map(p => {
          if (p.id !== personId) return p;
          const absences = p.absences || [];
          const exists = absences.some(a => a.start === data.start && a.end === data.end);
          if (exists) return p;
          return {
            ...p,
            absences: [...absences, { id: `abs-${Date.now()}`, start: data.start, end: data.end, label: 'Manuell' }]
          };
        }));

        setManualAbsence({ ...manualAbsence, [personId]: { start: '', end: '' } });
        showToast('Abwesenheit manuell eingetragen.', 'success');
      };

      // Erkennt, ob noch anonyme Beispieldaten (Demo) vorhanden sind.
      const hasDemoData = () =>
        (people || []).some(isDemoPerson)
        || (people || []).some(p => Array.isArray(p.absences) && p.absences.some(a => a && a.id === 'abs-demo-1'))
        || (locations || []).some(isDemoLocation)
        || (timeSlots || []).some(isDemoSlot)
        || (patterns || []).some(isDemoPattern)
        || (groups || []).some(isDemoGroup)
        || (schedule || []).some(isDemoTask);

      // Entfernt alle Beispieldaten aus den aktuellen Daten (mit Tombstones,
      // damit der Sync sie auf dem anderen Gerät nicht wiederherstellt).
      const clearDemoDataForImport = () => {
        let removedCount = 0;
        const wipe = (coll, arr, fn) => {
          const kept = (arr || []).filter(x => !fn(x));
          removedCount += (arr || []).length - kept.length;
          (arr || []).filter(fn).forEach(x => markDeleted(coll, x.id));
          return kept;
        };
        const nextPeople = wipe('people', people, isDemoPerson).map(p => {
          const absences = (p.absences || []).filter(a => a && a.id !== 'abs-demo-1');
          if (absences.length !== (p.absences || []).length) {
            removedCount += (p.absences || []).length - absences.length;
            (p.absences || []).filter(a => !a || a.id === 'abs-demo-1').forEach(a => markDeleted('absences', a.id));
            return { ...p, absences };
          }
          return p;
        });
        const nextLocations = wipe('locations', locations, isDemoLocation);
        const nextTimeSlots = wipe('timeSlots', timeSlots, isDemoSlot);
        const nextPatterns = wipe('patterns', patterns, isDemoPattern);
        const nextGroups = wipe('groups', groups, isDemoGroup);
        const nextSchedule = wipe('schedule', schedule, isDemoTask);
        setLocations(nextLocations);
        setTimeSlots(nextTimeSlots);
        setPatterns(nextPatterns);
        setGroups(nextGroups);
        setSchedule(nextSchedule);
        setPeople(nextPeople);
        return { people: nextPeople, removedCount };
      };

      // PDF Import Abwesenheiten
      
      // PDF Import Abwesenheiten (Robust & fehlerfrei)
      // Abwesenheiten importieren (unterstützt PDF und DOCX via Mammoth.js)
      const handlePdfImport = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const demoCleanupNeeded = hasDemoData();
        if (demoCleanupNeeded && !confirm('Beim ersten Import werden die Beispieldaten (Demo-Personen, Demo-Termine, Beispiel-Abwesenheit, Demo-Gruppen und -Muster) automatisch gelöscht, damit sich echte und Beispieldaten nicht mischen. Fortfahren?')) {
          e.target.value = '';
          return;
        }

        const fileName = file.name.toLowerCase();
        let textLines = [];

        try {
          if (fileName.endsWith('.docx')) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            textLines = result.value.split('\n').map(l => l.trim()).filter(Boolean);
          } else {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const content = await page.getTextContent();
              content.items.forEach(item => {
                const str = item.str ? item.str.trim() : '';
                if (str) textLines.push(str);
              });
            }
          }

          const monthsMap = {
            jan: '01', feb: '02', mär: '03', mar: '03', mrz: '03', apr: '04', 
            mai: '05', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', 
            okt: '10', oct: '10', nov: '11', dez: '12', dec: '12'
          };

          let demoRes = null;
          if (demoCleanupNeeded) demoRes = clearDemoDataForImport();
          let currentPeople = JSON.parse(JSON.stringify(demoRes ? demoRes.people : people));
          let addedCount = 0;
          let addedByPerson = {};
          let currentPersonName = null;

          textLines.forEach(line => {
            const cleanLine = line.replace(/^\|\s*/, '').trim();
            if (!cleanLine || cleanLine.includes('Gedruckt von') || cleanLine.includes('Person Abwesenheiten') || cleanLine.includes('Alle Gruppen') || cleanLine.includes('Treffpunkt') || cleanLine === 'Name' || cleanLine === 'Abwesend' || cleanLine === 'Freiberg') {
              return;
            }

            const matchedPerson = currentPeople.find(p => p.name.toLowerCase() === cleanLine.toLowerCase());
            const isNamePattern = /^[A-ZÄÖÜ][a-zäöüß]+\s+[A-ZÄÖÜ][a-zäöüß]+/.test(cleanLine) && !cleanLine.includes('2026') && !cleanLine.includes('2027') && !cleanLine.includes('-');

            if (matchedPerson || isNamePattern) {
              currentPersonName = matchedPerson ? matchedPerson.name : cleanLine;
              return;
            }

            if (!currentPersonName) return;

            // Datumsbereiche im Format z.B. "23 Nov 2026 – 27 Nov 2026" (unterstützt Bindestrich oder Geviertstrich „–“)
            const rangeRegex = /(\d{1,2})\s+([A-Za-zäÖüäöüß]{3})\s+(\d{4})\s*[–-]\s*(\d{1,2})(?:\s+([A-Za-zäÖüäöüß]{3}))?(?:\s+(\d{4}))?/gi;
            let match;

            while ((match = rangeRegex.exec(line)) !== null) {
              const d1 = match[1];
              const m1Str = match[2].toLowerCase().substring(0, 3);
              const y1 = match[3];
              const d2 = match[4];
              const m2Str = match[5] ? match[5].toLowerCase().substring(0, 3) : m1Str;
              const y2 = match[6] ? match[6] : y1;

              const sm = monthsMap[m1Str];
              const em = monthsMap[m2Str];

              if (sm && em) {
                const start = `${y1}-${sm}-${d1.padStart(2, '0')}`;
                const end = `${y2}-${em}-${d2.padStart(2, '0')}`;

                let person = currentPeople.find(p => p.name.toLowerCase() === currentPersonName.toLowerCase());
                if (!person) {
                  person = { id: `p-${Date.now()}-${Math.floor(Math.random() * 1000)}`, name: currentPersonName, absences: [], matrix: {} };
                  currentPeople.push(person);
                }

                if (!person.absences) person.absences = [];
                const exists = person.absences.some(a => a.start === start && a.end === end);
                if (!exists) {
                  person.absences.push({ id: `abs-${Date.now()}-${Math.random()}`, start, end, label: 'DOCX/PDF Import' });
                  addedCount++;
                  if (!addedByPerson[person.name]) addedByPerson[person.name] = [];
                  addedByPerson[person.name].push(start === end ? start : `${start} – ${end}`);
                }
              }
            }
          });

          setPeople(currentPeople);
          if (addedCount > 0) {
            setImportBanner({
              title: `✅ ${addedCount} neue Abwesenheiten importiert`,
              lines: [
                ...(demoRes ? [`🧹 ${demoRes.removedCount} Beispieldaten entfernt`] : []),
                ...Object.keys(addedByPerson).map(name => `${name}: ${addedByPerson[name].join(', ')}`)
              ]
            });
          } else {
            showToast(demoRes ? `Keine neuen Abwesenheiten erkannt. ${demoRes.removedCount} Beispieldaten wurden gelöscht.` : 'Keine neuen Abwesenheiten erkannt.', 'error');
          }
        } catch (err) {
          console.error(err);
          showToast('Fehler beim Lesen der Datei.', 'error');
        }
      };

      // Ereignisse importieren (DOCX/TXT) – erscheinen wie Feiertage im Kalender
      const handleEventsImport = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const demoCleanupNeeded = hasDemoData();
        if (demoCleanupNeeded && !confirm('Beim ersten Import werden die Beispieldaten (Demo-Personen, Demo-Termine, Beispiel-Abwesenheit, Demo-Gruppen und -Muster) automatisch gelöscht, damit sich echte und Beispieldaten nicht mischen. Fortfahren?')) {
          e.target.value = '';
          return;
        }
        try {
          let raw = '';
          const fileName = file.name.toLowerCase();
          if (fileName.endsWith('.docx')) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            raw = result.value;
          } else {
            raw = await file.text();
          }
          const parsed = parseEventsFromText(raw);
          if (parsed.length === 0) { showToast('Keine Ereignisse in der Datei erkannt.', 'error'); e.target.value = ''; return; }
          const keyOf = (ev) => `${ev.dateStr}|${ev.endDateStr || ''}|${ev.title}|${ev.time || ''}`;
          const seen = new Set((events || []).map(keyOf));
          const fresh = parsed.filter(ev => !seen.has(keyOf(ev)));
          if (fresh.length === 0) { showToast('Alle Ereignisse sind bereits vorhanden.', 'error'); e.target.value = ''; return; }
          const demoRes = demoCleanupNeeded ? clearDemoDataForImport() : null;
          setEvents([...(events || []), ...fresh]);
          setImportBanner({
            title: `✅ ${fresh.length} neue Ereignisse importiert`,
            lines: [
              ...(demoRes ? [`🧹 ${demoRes.removedCount} Beispieldaten entfernt`] : []),
              ...fresh.map(ev => `${ev.title} – ${ev.dateStr}${ev.endDateStr ? ' – ' + ev.endDateStr : ''}${ev.time ? ', ' + ev.time : ''}${ev.note ? ' (' + ev.note + ')' : ''}`)
            ]
          });
        } catch (err) {
          console.error(err);
          showToast('Fehler beim Lesen der Datei.', 'error');
        }
        e.target.value = '';
      };

      const handleBackupImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            const now = Date.now();
            // Sync-Verbindlichkeit: Der Backup-Stand gilt als maßgeblich.
            // 1. Alles, was lokal existiert, aber im Backup fehlt, bekommt eine Lösch-Markierung (Tombstone) –
            //    so wird die Löschung auf dem anderen Gerät übernommen statt dort wiederhergestellt.
            // 2. Alles, was im Backup liegt, wird aus den Lösch-Markierungen entfernt (Wiederherstellung).
            const COLL_PAIRS = [
              ['locations', locations], ['timeSlots', timeSlots], ['patterns', patterns],
              ['groups', groups], ['people', people], ['schedule', schedule], ['events', events]
            ];
            const tombAdd = {};
            COLL_PAIRS.forEach(([coll, localArr]) => {
              if (!Array.isArray(data[coll])) return;
              const backupIds = new Set(data[coll].map(x => (x && x.id) || null).filter(Boolean));
              (localArr || []).forEach(x => {
                if (x && x.id && !backupIds.has(x.id)) (tombAdd[coll] = tombAdd[coll] || {})[x.id] = now;
              });
            });
            // Abwesenheiten sitzen in den Personen – ebenso vergleichen
            const backupAbsIds = new Set(Array.isArray(data.people) ? data.people.flatMap(p => Array.isArray(p && p.absences) ? p.absences.map(a => (a && a.id) || null).filter(Boolean) : []) : []);
            (people || []).forEach(p => (p.absences || []).forEach(a => {
              if (a && a.id && !backupAbsIds.has(a.id)) (tombAdd.absences = tombAdd.absences || {})[a.id] = now;
            }));
            setTombstones(prev => {
              const next = { ...prev };
              Object.entries(tombAdd).forEach(([coll, ids]) => { next[coll] = { ...(next[coll] || {}), ...ids }; });
              COLL_PAIRS.forEach(([coll]) => {
                if (!Array.isArray(data[coll])) return;
                const nextColl = { ...(next[coll] || {}) };
                data[coll].forEach(x => { if (x && x.id && nextColl[x.id] !== undefined) delete nextColl[x.id]; });
                next[coll] = nextColl;
              });
              if (Array.isArray(data.people)) {
                const nextAbs = { ...(next.absences || {}) };
                data.people.forEach(p => (p && Array.isArray(p.absences) ? p.absences : []).forEach(a => {
                  if (a && a.id && nextAbs[a.id] !== undefined) delete nextAbs[a.id];
                }));
                next.absences = nextAbs;
              }
              return normalizeTombstones(next);
            });
            // 3. Importierte Einträge erhalten den aktuellen Zeitstempel, damit sie im Sync
            //    (neuester Stand gewinnt) den älteren Stand auf dem anderen Gerät ersetzen.
            const bump = (arr) => (Array.isArray(arr) ? arr.map(x => (x && typeof x === 'object') ? { ...x, updatedAt: now } : x) : arr);
            if (data.locations) setLocations(bump(data.locations));
            if (data.timeSlots) setTimeSlots(bump(data.timeSlots));
            if (data.patterns) setPatterns(bump(data.patterns));
            if (data.groups) setGroups(bump(data.groups));
            if (data.people) setPeople(bump(data.people).map(p => (p && typeof p === 'object') ? { ...p, absences: (Array.isArray(p.absences) ? p.absences : []).map(a => (a && typeof a === 'object') ? { ...a, updatedAt: now } : a) } : p));
            if (data.schedule) setSchedule(bump(data.schedule));
            if (data.events) setEvents(bump(data.events));
            const removedTotal = Object.values(tombAdd).reduce((acc, m) => acc + Object.keys(m).length, 0);
            showToast('Backup erfolgreich importiert!' + (removedTotal > 0 ? ` ${removedTotal} Einträge, die im Backup nicht vorhanden sind, wurden zur Löschung vorgemerkt und werden auf dem anderen Gerät entfernt.` : ''), 'success');
          } catch (err) {
            console.error(err);
            showToast('Ungültiges Backup-Dateiformat.', 'error');
          }
        };
        reader.readAsText(file);
      };

      // Kalenderraster-Berechnung mit vollständigen Wochen (Mo-So)
      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);

      let gridStart = new Date(firstDayOfMonth);
      let startDayOfWeek = gridStart.getDay();
      gridStart.setDate(gridStart.getDate() - (startDayOfWeek === 0 ? 6 : startDayOfWeek - 1));

      let gridEnd = new Date(lastDayOfMonth);
      let endDayOfWeek = gridEnd.getDay();
      if (endDayOfWeek !== 0) {
        gridEnd.setDate(gridEnd.getDate() + (7 - endDayOfWeek));
      }

      const dayElements = [];
      let currIter = new Date(gridStart);

      while (currIter <= gridEnd) {
        const dateStr = toLocalDateStr(currIter);
        const dayNum = currIter.getDate();
        const isCurrentMonth = currIter.getMonth() === month;
        const isSelected = selectedDateStr === dateStr;
        const holidayName = holidays[dateStr];
        const dayEvents = eventsByDate[dateStr] || [];
        const dayTasks = schedule.filter(t => t.dateStr === dateStr);
        dayElements.push(
          h('div', {
            key: dateStr,
            onClick: () => setSelectedDateStr(dateStr),
            className: `min-h-[60px] sm:min-h-24 p-1 sm:p-1.5 border rounded-lg cursor-pointer transition-all flex flex-col justify-between min-w-0 print-day-box ${
              isSelected ? 'border-indigo-600 bg-indigo-50/30 ring-2 ring-indigo-200' : 'border-slate-200 bg-white hover:border-slate-300'
            } ${!isCurrentMonth ? 'opacity-40 bg-slate-100/50' : ''} ${holidayName ? 'bg-amber-50/40' : (dayEvents.length > 0 ? 'bg-violet-50/40' : '')}`
          },
            h('div', { className: 'flex justify-between items-start' },
              h('span', { className: `text-xs font-bold px-1.5 py-0.5 rounded ${holidayName ? 'bg-amber-200 text-amber-900' : 'text-slate-700'}` }, dayNum),
              holidayName ? h('span', { className: 'text-[9px] font-semibold text-amber-700 truncate max-w-[36px] sm:max-w-[70px]' }, holidayName) : null,
              dayEvents.length > 0 ? h('span', {
                className: 'text-[9px] font-semibold text-violet-700 truncate max-w-[36px] sm:max-w-[70px]',
                title: dayEvents.map(ev => `${ev.title}${ev.time ? ' ' + ev.time : ''}${ev.note ? ' (' + ev.note + ')' : ''}`).join(' · ')
              }, dayEvents.map(ev => ev.title).join(' · ')) : null
            ),
            h('div', { className: 'hidden sm:block space-y-1 my-1 min-w-0' },
              dayTasks.map(t => {
                const loc = locations.find(l => l.id === t.locationId);
                const slot = timeSlots.find(s => s.id === t.slotId);
                const person = people.find(p => p.id === t.assignedPersonId);
                const taskGroupNames = (t.groupIds || []).map(gid => groups.find(g => g.id === gid)?.name).filter(Boolean);
                const chipCls = taskChipClass(person ? getPersonColorById(person.id) : null, taskGroupNames.length);
                return h('div', { key: t.id, className: `p-1 rounded border flex items-center gap-1 min-w-0 ${chipCls}` },
                  taskGroupNames.length > 0 ? taskGroupNames.map((gn, gi) => h('span', { key: gi, title: `Gruppentermin: ${taskGroupNames.join(', ')}`, className: 'text-[8px] font-bold bg-white text-blue-800 rounded-full min-w-[12px] h-[12px] px-0.5 flex items-center justify-center shrink-0' }, groupLetter(gn))) : null,
                  h('span', { className: 'text-[10px] font-bold opacity-90 shrink-0' }, slot?.time || ''),
                  h('div', { className: 'min-w-0 flex-1 leading-tight' },
                    h('span', { className: 'text-xs font-bold truncate block' }, person ? person.name : (taskGroupNames.length > 1 ? 'Gruppen' : (taskGroupNames.length === 1 ? taskGroupNames[0] : 'Offen'))),
                    h('span', { className: 'text-[10px] opacity-80 truncate block' }, loc?.name || 'Ort')
                  )
                );
              })
            ),
            dayTasks.length > 0 ? h('div', { className: 'sm:hidden my-1 space-y-1 min-w-0' },
              dayTasks.map(t => {
                const loc = locations.find(l => l.id === t.locationId);
                const slot = timeSlots.find(s => s.id === t.slotId);
                const person = people.find(p => p.id === t.assignedPersonId);
                const taskGroupNames = (t.groupIds || []).map(gid => groups.find(g => g.id === gid)?.name).filter(Boolean);
                const chipCls = taskChipClass(person ? getPersonColorById(person.id) : null, taskGroupNames.length);
                return h('div', {
                  key: t.id,
                  title: taskGroupNames.length > 0 ? `Gruppentermin: ${taskGroupNames.join(', ')}${person ? ' · ' + person.name : ''}` : (person ? `${person.name} · ${loc?.name || 'Ort'} ${slot?.time || ''}` : 'Offen'),
                  className: `px-0.5 py-0.5 rounded border text-center leading-none ${chipCls}`
                },
                  taskGroupNames.length > 0
                    ? h('div', { className: 'flex items-center justify-center gap-0.5 flex-wrap' },
                        taskGroupNames.map((gn, gi) => h('span', { key: gi, className: 'text-[8px] font-bold bg-white text-blue-800 rounded-full min-w-[12px] h-[12px] px-0.5 flex items-center justify-center' }, groupLetter(gn)))
                      )
                    : h('div', { className: 'text-[11px] font-bold' }, person ? getInitials(person.name) : 'Offen'),
                  slot?.time ? h('div', { className: 'text-[8px] font-normal mt-0.5' }, slot.time) : null
                );
              })
            ) : null
          )
        );

        currIter.setDate(currIter.getDate() + 1);
      }

      const selectedDayTasks = schedule.filter(t => t.dateStr === selectedDateStr);
      const selectedDayOfWeek = parseLocalDate(selectedDateStr).getDay();
      const validSlotsForSelectedDay = timeSlots.filter(s => s.dayOfWeek === selectedDayOfWeek);

      const syncConnected = sync?.status === 'connected';
      const syncPending = sync?.status === 'waiting' || sync?.status === 'connecting';

                ),
                h('div', { className: 'space-y-2' },
                  locations.map(l => h('div', { key: l.id, className: 'p-2 border rounded bg-slate-50 flex justify-between items-center text-xs' },
                    h('span', { className: 'font-bold' }, l.name),
                    h('button', { onClick: () => { markDeleted('locations', l.id); setLocations(locations.filter(loc => loc.id !== l.id)); }, className: 'text-rose-500' }, 'Löschen')
                  ))
                )
              ),

              h('div', { className: 'bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4' },
                h('h2', { className: 'text-lg font-bold text-slate-800' }, 'Zeitslots verwalten'),
                h('form', { onSubmit: handleAddSlot, className: 'flex gap-2 items-end' },
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'text-[10px] font-bold text-slate-500 block mb-1' }, 'Wochentag'),
                    h('select', {
                      value: newSlotDay,
                      onChange: (e) => setNewSlotDay(e.target.value),
                      className: 'w-full text-xs p-2 border rounded-lg bg-white border-slate-300'
                    },
                      DAY_NAMES.map((d, idx) => h('option', { key: idx, value: idx }, d))
                    )
                  ),
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'text-[10px] font-bold text-slate-500 block mb-1' }, 'Uhrzeit'),
                    h('input', {
                      type: 'time',
                      value: newSlotTime,
                      onChange: (e) => setNewSlotTime(e.target.value),
                      className: 'w-full text-xs p-2 border rounded-lg bg-white border-slate-300'
                    })
                  ),
                  h('button', { type: 'submit', className: 'bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-lg h-9' }, '+ Slot')
                ),
                h('div', { className: 'space-y-2' },
                  timeSlots.map(s => h('div', { key: s.id, className: 'p-2 border rounded bg-slate-50 flex justify-between items-center text-xs' },
                    h('span', { className: 'font-bold' }, `${DAY_NAMES[s.dayOfWeek]} ${s.time} Uhr`),
                    h('button', { onClick: () => { markDeleted('timeSlots', s.id); setTimeSlots(timeSlots.filter(slot => slot.id !== s.id)); }, className: 'text-rose-500' }, 'Löschen')
                  ))
                )
              )
            ),

            h('div', { className: 'bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4' },
              h('h2', { className: 'text-lg font-bold text-slate-800' }, 'Gruppen verwalten'),
              h('p', { className: 'text-xs text-slate-500' }, 'Gruppen (z. B. Teams oder Schichtgruppen) anlegen und Personen zuordnen. Terminen und Mustern können optional relevante Gruppen zugewiesen werden – bei der automatischen Zuteilung werden dann nur Personen dieser Gruppen berücksichtigt.'),
              h('form', { onSubmit: handleAddGroup, className: 'flex gap-2 items-center' },
                h('input', {
                  type: 'text',
                  placeholder: 'Neuer Gruppenname...',
                  value: newGroupName,
                  onChange: (e) => setNewGroupName(e.target.value),
                  className: 'text-xs p-2 border rounded-lg bg-white border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500'
                }),
                h('button', { type: 'submit', className: 'bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-lg' }, '+ Gruppe')
              ),
              h('div', { className: 'space-y-3' },
                groups.length === 0 ? h('p', { className: 'text-xs text-slate-400 italic' }, 'Noch keine Gruppen angelegt.') :
                groups.map(g => h('div', { key: g.id, className: 'p-3 border rounded-lg bg-slate-50 space-y-2' },
                  h('div', { className: 'flex justify-between items-center' },
                    h('span', { className: 'font-bold text-xs text-slate-800' }, `${g.name} (${(g.personIds || []).length} Personen)`),
                    h('button', { onClick: () => handleDeleteGroup(g.id), className: 'text-rose-500 font-bold text-xs hover:underline' }, 'Löschen')
                  ),
                  h('div', { className: 'flex flex-wrap gap-1' },
                    [...people].sort((a, b) => a.name.localeCompare(b.name, 'de')).map(p => {
                      const isMember = (g.personIds || []).includes(p.id);
                      return h('button', {
                        key: p.id, type: 'button',
                        onClick: () => toggleGroupMember(g.id, p.id),
                        className: `px-2 py-0.5 rounded-full border text-[10px] font-semibold ${isMember ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-white text-slate-600 border-slate-300 hover:border-indigo-300'}`
                      }, `${isMember ? '✓ ' : ''}${p.name}`)
                    })
                  )
                ))
              )
            ),

            h('div', { className: 'bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4' },
              h('h2', { className: 'text-lg font-bold text-slate-800' }, 'Feiertage'),
              h('div', { className: 'max-w-xs' },
                h('label', { className: 'text-[10px] font-bold text-slate-500 block mb-1' }, 'Bundesland (für Feiertage im Kalender)'),
                h('select', {
                  value: bundesland,
                  onChange: (e) => setBundesland(e.target.value),
                  className: 'w-full text-xs p-2 border rounded-lg bg-white border-slate-300'
                },
                  GERMAN_STATES.map(s => h('option', { key: s.code, value: s.code }, s.name))
                )
              ),
              h('p', { className: 'text-xs text-slate-500' }, 'Legt fest, welche gesetzlichen Feiertage im Kalender angezeigt und bei der Planung berücksichtigt werden. Standard: Sachsen.')
            ),

            h('div', { className: 'bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4' },
              h('h2', { className: 'text-lg font-bold text-slate-800' }, 'Ereignisse'),
              events.length > 0 ? h('div', { className: 'space-y-1 max-h-64 overflow-auto' },
                [...events].sort((a, b) => a.dateStr.localeCompare(b.dateStr)).map(ev => h('div', { key: ev.id, className: 'flex items-center justify-between text-xs bg-slate-50 rounded-lg px-3 py-2 gap-2' },
                  h('div', { className: 'min-w-0' },
                    h('div', { className: 'font-bold text-slate-800 truncate' }, `${ev.title}${ev.time ? ' · ' + ev.time + (ev.timeEnd ? '-' + ev.timeEnd : '') : ''}`),
                    h('div', { className: 'text-slate-500 truncate' }, `${ev.dateStr}${ev.endDateStr ? ' – ' + ev.endDateStr : ''}${ev.note ? ' · ' + ev.note : ''}`)
                  ),
                  h('button', { onClick: () => { markDeleted('events', ev.id); setEvents(events.filter(x => x.id !== ev.id)); }, className: 'text-rose-500 font-bold text-xs hover:underline shrink-0' }, 'Löschen')
                ))
              ) : h('p', { className: 'text-xs text-slate-500' }, 'Noch keine Ereignisse importiert. Importierte Ereignisse erscheinen wie Feiertage im Kalender und werden mitgesynct.')
            ),

            h('div', { className: 'bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-3' },
              h('h2', { className: 'text-lg font-bold text-slate-800' }, 'Gruppen-Termine: Verteilung'),
              h('p', { className: 'text-xs text-slate-500' }, 'Festlegen, wie Gruppentermine in die automatische Verteilung einfließen (gilt für „4. Personen zuteilen“ und die ⭐ Empfehlung). Die Einstellung wird mit den Daten synchronisiert.'),
              h('label', { className: 'flex items-start gap-3 cursor-pointer p-2 rounded-lg hover:bg-slate-50' },
                h('input', { type: 'checkbox', checked: settings.autoAssignGroups, onChange: () => setSettings(prev => ({ ...prev, autoAssignGroups: !prev.autoAssignGroups, updatedAt: Date.now() })), className: 'mt-0.5 w-4 h-4 accent-indigo-600' }),
                h('span', null,
                  h('span', { className: 'text-sm font-bold text-slate-800 block' }, 'Gruppentermine automatisch zuteilen'),
                  h('span', { className: 'text-xs text-slate-500' }, 'Standardmäßig aus: Gruppentermine werden nur manuell zugeteilt. Aktiviert: „4. Personen zuteilen“ besetzt auch Gruppentermine – ausschließlich mit Personen aus den relevanten Gruppen; Qualifikation und Verfügbarkeit bleiben maßgeblich.')
                )
              ),
              h('label', { className: 'flex items-start gap-3 cursor-pointer p-2 rounded-lg hover:bg-slate-50' },
                h('input', { type: 'checkbox', checked: settings.groupsCountInStats, onChange: () => setSettings(prev => ({ ...prev, groupsCountInStats: !prev.groupsCountInStats, updatedAt: Date.now() })), className: 'mt-0.5 w-4 h-4 accent-indigo-600' }),
                h('span', null,
                  h('span', { className: 'text-sm font-bold text-slate-800 block' }, 'Gruppentermine in die Verteilungsbilanz einbeziehen'),
                  h('span', { className: 'text-xs text-slate-500' }, 'Standardmäßig aus: Gruppentermine laufen „außer Konkurrenz“ – sie zählen weder in die Empfehlung noch in die automatische Verteilung. Aktiviert: Zuteilungen an Gruppenterminen zählen mit und beeinflussen die gerechte Verteilung.')
                )
              )
            ),

            h('div', { className: 'bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4' },
              h('h2', { className: 'text-lg font-bold text-slate-800' }, 'Datensicherung & App-Export'),
              h('div', { className: 'flex flex-wrap gap-4 items-center' },
                h('button', {
                  onClick: handleDownloadAppHtml,
                  className: 'px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold text-xs shadow-sm hover:bg-indigo-700'
                }, '📥 Gesamte App (.html) herunterladen'),
                h('button', {
                  onClick: () => {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ locations, timeSlots, patterns, groups, people, schedule, events }));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", "aufgabenplaner_backup.json");
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                  },
                  className: 'px-4 py-2 bg-slate-700 text-white rounded-lg font-bold text-xs shadow-sm hover:bg-slate-800'
                }, 'Backup Exportieren (JSON)'),
                h('label', { className: 'cursor-pointer px-4 py-2 bg-slate-800 text-white rounded-lg font-bold text-xs shadow-sm hover:bg-slate-900' },
                  'Backup Importieren (JSON)',
                  h('input', { type: 'file', accept: 'application/json', onChange: handleBackupImport, className: 'hidden' })
                )
              )
            ),
            h('div', { className: 'bg-white p-6 rounded-xl border border-rose-200 bg-rose-50/20 shadow-sm space-y-4' },
              h('h2', { className: 'text-lg font-bold text-rose-800' }, 'Gefahrenzone'),
              h('p', { className: 'text-xs text-rose-600' }, 'Setzt die gesamte Anwendung inklusive aller gespeicherten Orte, Zeitslots, Personen und Termine komplett zurück.'),
              h('button', {
                onClick: handleClearAllData,
                className: 'px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-lg shadow-sm'
              }, '⚠️ Alle Anwendungsdaten komplett löschen')
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root') || document.document.getElementById('root'));
    // Wait, document.document.getElementById('root') is correct. Let's fix that typo.
    root.render(h(App));
  </script>
</body>
</html>
