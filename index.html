<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, useRef, createElement: h } = React;

    const APP_VERSION = '1.11.12';

    // Vergleicht zwei Versionsnummern („1.10.3“ > „1.9.9“) – true nur, wenn a neuer als b ist
    const isNewerVersion = (a, b) => {
      const pa = String(a || '').split('.').map(n => parseInt(n, 10) || 0);
      const pb = String(b || '').split('.').map(n => parseInt(n, 10) || 0);
      const len = Math.max(pa.length, pb.length);
      for (let i = 0; i < len; i++) {
        const diff = (pa[i] || 0) - (pb[i] || 0);
        if (diff !== 0) return diff > 0;
      }
      return false;
    };

    const DAY_NAMES = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

    // Externes 3-Schicht-System: Frühschicht (06-14), Spätschicht (14-22), Nachtschicht (22-06)
    // Nachtschicht blockiert zusätzlich den Folgetag bis 14 Uhr (Frühfenster).
    const SHIFT_DEFS = {
      frueh: { label: 'Frühschicht', short: 'F', color: 'bg-amber-100 text-amber-800 border-amber-300' },
      spaet: { label: 'Spätschicht', short: 'S', color: 'bg-sky-100 text-sky-800 border-sky-300' },
      nacht: { label: 'Nachtschicht', short: 'N', color: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
      frei: { label: 'Frei', short: '–', color: 'bg-slate-100 text-slate-500 border-slate-300' }
    };
    const SHIFT_CYCLE_ORDER = ['frei', 'frueh', 'spaet', 'nacht'];
    const DEFAULT_SHIFT_CYCLE = ['frueh', 'frueh', 'spaet', 'spaet', 'nacht', 'nacht', 'frei', 'frei'];

    // Feste, eindeutige Farbe pro Person: Kollisionen werden deterministisch aufgeloest,
    // rote Toene sind reserviert fuer unbesetzte Termine
    const PERSON_COLORS = [
      'bg-indigo-100 text-indigo-900 border-indigo-300',
      'bg-emerald-100 text-emerald-900 border-emerald-300',
      'bg-amber-100 text-amber-900 border-amber-300',
      'bg-sky-100 text-sky-900 border-sky-300',
      'bg-violet-100 text-violet-900 border-violet-300',
      'bg-teal-100 text-teal-900 border-teal-300',
      'bg-orange-100 text-orange-900 border-orange-300',
      'bg-lime-100 text-lime-900 border-lime-300',
      'bg-cyan-100 text-cyan-900 border-cyan-300',
      'bg-fuchsia-100 text-fuchsia-900 border-fuchsia-300',
      'bg-pink-100 text-pink-900 border-pink-300',
      'bg-yellow-100 text-yellow-900 border-yellow-300',
      'bg-green-100 text-green-900 border-green-300',
      'bg-blue-100 text-blue-900 border-blue-300',
      'bg-purple-100 text-purple-900 border-purple-300',
      'bg-stone-100 text-stone-900 border-stone-300',
      'bg-slate-100 text-slate-900 border-slate-300',
      'bg-zinc-100 text-zinc-900 border-zinc-300'
    ];
    const personColorHash = (id) => {
      let hash = 0;
      for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
      return hash;
    };
    const getPersonColor = (id) => {
      if (!id) return 'bg-slate-100 text-slate-700 border-slate-300';
      return PERSON_COLORS[personColorHash(id) % PERSON_COLORS.length];
    };
    const buildPersonColorMap = (peopleList) => {
      const used = new Set();
      const map = {};
      [...peopleList].sort((a, b) => a.id.localeCompare(b.id)).forEach(p => {
        let idx = personColorHash(p.id) % PERSON_COLORS.length;
        if (used.size < PERSON_COLORS.length) {
          while (used.has(idx)) idx = (idx + 1) % PERSON_COLORS.length;
          used.add(idx);
        }
        map[p.id] = PERSON_COLORS[idx];
      });
      return map;
    };
    const taskChipClass = (personColor, groupCount) => {
      if (groupCount > 1) return 'bg-blue-700 text-white border-blue-800';
      if (groupCount === 1) return 'bg-blue-100 text-blue-900 border-blue-300';
      return personColor || 'bg-red-50 border-red-300 text-red-700';
    };

    // ---------- Lokaler KI-Erklär-Assistent (WebLLM, WebGPU) ----------
    const ASSISTANT_SYSTEM_PROMPT = [
      'Du bist der Erkl\u00e4r-Assistent eines Monatsplaners f\u00fcr Aufgaben.',
      'Antworte immer kurz, klar und auf Deutsch.',
      'Beantworte immer nur die letzte Frage im Verlauf und wiederhole keine fr\u00fcheren Antworten.',
      'Antworte ausschlie\u00dflich auf Basis der dir gegebenen Daten \u2013 erfinde nichts.',
      'Die automatische Verteilung folgt festen Regeln (in dieser Reihenfolge): 1. L\u00e4ngste Pause (Abstand zur n\u00e4chsten Einteilung davor oder danach), 2. Niedrigste Bilanz (wenigste Einteilungen), 3. Wochentags-Ausgleich, 4. Alphabetisch.',
      'Nur qualifizierte und verf\u00fcgbare Personen k\u00f6nnen eingeteilt werden. Nicht verf\u00fcgbar sind: Abwesende, Personen in Fr\u00fchschicht (06-14 Uhr), Sp\u00e4tschicht (14-22 Uhr), Nachtschicht (22-06 Uhr plus Folgetag bis 14 Uhr) oder mit Gruppentermin am selben Tag.',
      'Gruppentermine laufen au\u00dfer Konkurrenz: sie z\u00e4hlen nicht in die Bilanz und blockieren den Tag f\u00fcr allgemeine Termine.',
      'Die Verteilung wurde deterministisch berechnet \u2013 erkl\u00e4re sie, schlage keine \u00c4nderungen am Verfahren vor.'
    ].join(' ');
    const AI_MODELS = [
      { id: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', label: 'Qwen 0,5B \u2013 klein (~0,9 GB)' },
      { id: 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC', label: 'Qwen 1,5B \u2013 empfohlen (~1,6 GB)' },
      { id: 'Llama-3.2-3B-Instruct-q4f16_1-MLC', label: 'Llama 3.2 3B \u2013 gr\u00f6\u00dfter (~2,2 GB)' }
    ];
    const getInitials = (name) => {
      if (!name) return '?';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    };

    // Ein-Buchstaben-Kürzel für Gruppen-Chips: unterscheidendes Wort nutzen (z. B. "Gruppe Nord" -> "N")
    const groupLetter = (name) => {
      if (!name) return '?';
      const parts = name.trim().split(/\s+/);
      return (parts.length > 1 ? parts[parts.length - 1][0] : parts[0][0]).toUpperCase();
    };

    // Externe Schicht einer Person an einem Datum (Rotation ab Startdatum, null = keine Einschränkung)
    function getExternalShiftForDate(person, dateStr) {
      const rot = person?.shiftRotation;
      if (!rot?.enabled || !rot.startDate || !Array.isArray(rot.cycle) || rot.cycle.length === 0) return null;
      const diff = Math.floor((parseLocalDate(dateStr) - parseLocalDate(rot.startDate)) / 86400000);
      if (diff < 0) return null;
      const shift = rot.cycle[diff % rot.cycle.length];
      return shift && shift !== 'frei' ? shift : null;
    }

    // Liefert Label der blockierenden Schicht oder null, wenn die Person den Zeitslot wahrnehmen kann
    function getExternalShiftBlock(person, dateStr, slotTime) {
      const parts = String(slotTime || '').split(':');
      const hour = parseInt(parts[0], 10) + parseInt(parts[1] || '0', 10) / 60;
      if (isNaN(hour)) return null;
      const today = getExternalShiftForDate(person, dateStr);
      const yesterdayStr = toLocalDateStr(new Date(parseLocalDate(dateStr).getTime() - 86400000));
      const yesterday = getExternalShiftForDate(person, yesterdayStr);
      if (today === 'frueh' && hour >= 6 && hour < 14) return 'Frühschicht';
      if (today === 'spaet' && hour >= 14 && hour < 22) return 'Spätschicht';
      if (today === 'nacht' && hour >= 22) return 'Nachtschicht';
      if (yesterday === 'nacht' && hour < 14) return 'Nachtschicht (Folgetag)';
      return null;
    }

    // Sächsische Feiertage dynamisch berechnen
    
    // ISO Kalenderwoche berechnen
    function getIsoWeek(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
    }

    
    // Lokales Datum im Format YYYY-MM-DD erzeugen (verhindert Zeitzonen-Verschiebungen durch toISOString)
    
    // Datum aus YYYY-MM-DD string lokal erzeugen (verhindert Zeitzonen-Verschiebungen)
    function parseLocalDate(dateStr) {
      if (!dateStr) return new Date();
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      }
      return new Date(dateStr);
    }

    function toLocalDateStr(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    const GERMAN_STATES = [
      { code: 'BW', name: 'Baden-Württemberg' },
      { code: 'BY', name: 'Bayern' },
      { code: 'BE', name: 'Berlin' },
      { code: 'BB', name: 'Brandenburg' },
      { code: 'HB', name: 'Bremen' },
      { code: 'HH', name: 'Hamburg' },
      { code: 'HE', name: 'Hessen' },
      { code: 'MV', name: 'Mecklenburg-Vorpommern' },
      { code: 'NI', name: 'Niedersachsen' },
      { code: 'NW', name: 'Nordrhein-Westfalen' },
      { code: 'RP', name: 'Rheinland-Pfalz' },
      { code: 'SL', name: 'Saarland' },
      { code: 'SN', name: 'Sachsen' },
      { code: 'ST', name: 'Sachsen-Anhalt' },
      { code: 'SH', name: 'Schleswig-Holstein' },
      { code: 'TH', name: 'Thüringen' }
    ];

    function getGermanHolidays(year, bundesland) {
      const bl = GERMAN_STATES.some(s => s.code === bundesland) ? bundesland : 'SN';
      const getEaster = (y) => {
        const a = y % 19, b = Math.floor(y / 100), c = y % 100;
        const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4), k = c % 4, L = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * L) / 451);
        const month = Math.floor((h + L - 7 * m + 114) / 31);
        const day = ((h + L - 7 * m + 114) % 31) + 1;
        return new Date(y, month - 1, day);
      };

      const format = (d) => toLocalDateStr(d);
      const addDays = (d, days) => {
        const res = new Date(d);
        res.setDate(res.getDate() + days);
        return res;
      };

      const easter = getEaster(year);
      const holidays = {
        [`${year}-01-01`]: 'Neujahr',
        [`${year}-05-01`]: 'Tag der Arbeit',
        [`${year}-10-03`]: 'Tag der Deutschen Einheit',
        [`${year}-12-25`]: '1. Weihnachtstag',
        [`${year}-12-26`]: '2. Weihnachtstag',
        [format(addDays(easter, -2))]: 'Karfreitag',
        [format(addDays(easter, 1))]: 'Ostermontag',
        [format(addDays(easter, 39))]: 'Christi Himmelfahrt',
        [format(addDays(easter, 50))]: 'Pfingstmontag',
      };

      const inState = (codes) => codes.includes(bl);
      if (inState(['BW', 'BY', 'ST'])) holidays[`${year}-01-06`] = 'Heilige Drei Könige';
      if (inState(['BE', 'MV'])) holidays[`${year}-03-08`] = 'Internationaler Frauentag';
      if (inState(['BB', 'HB', 'HH', 'MV', 'NI', 'SH', 'SN', 'ST', 'TH'])) holidays[`${year}-10-31`] = 'Reformationstag';
      if (inState(['BW', 'BY', 'HE', 'NW', 'RP'])) holidays[format(addDays(easter, 60))] = 'Fronleichnam';
      if (inState(['BY', 'SL'])) holidays[`${year}-08-15`] = 'Mariä Himmelfahrt';
      if (inState(['BW', 'BY', 'NW', 'RP', 'SL'])) holidays[`${year}-11-01`] = 'Allerheiligen';
      if (inState(['TH'])) holidays[`${year}-09-20`] = 'Weltkindertag';
      if (inState(['BB'])) {
        holidays[format(easter)] = 'Ostersonntag';
        holidays[format(addDays(easter, 49))] = 'Pfingstsonntag';
      }
      if (bl === 'SN') {
        const nov23 = new Date(year, 10, 23);
        let bussBettag = new Date(nov23);
        let dayOfWeek = bussBettag.getDay();
        let diff = dayOfWeek >= 3 ? dayOfWeek - 3 : 7 - (3 - dayOfWeek);
        if (diff === 0) diff = 7;
        bussBettag.setDate(bussBettag.getDate() - diff);
        holidays[format(bussBettag)] = 'Buß- und Bettag';
      }

      return holidays;
    }

    // Prüft, ob ein Datum der x-te bestimmte Wochentag im Monat ist (week: 1-4 oder 'last')
    function isNthWeekdayOfMonth(date, week, weekday) {
      if (date.getDay() !== weekday) return false;
      if (week === 'last') {
        const next = new Date(date);
        next.setDate(next.getDate() + 7);
        return next.getMonth() !== date.getMonth();
      }
      return Math.floor((date.getDate() - 1) / 7) + 1 === parseInt(week, 10);
    }

    // Prüft, ob ein Muster an einem Datum greift (wöchentlich, 2-wöchentlich oder monatlich)
    function patternMatchesDate(pat, date, slot) {
      if (pat.frequency === 'monthly') {
        if (pat.monthlyMode === 'nthWeekday') return isNthWeekdayOfMonth(date, pat.monthlyWeek, parseInt(pat.monthlyWeekDay, 10));
        return date.getDate() === (parseInt(pat.monthlyDay, 10) || 1);
      }
      if (!slot || slot.dayOfWeek !== date.getDay()) return false;
      if (pat.frequency === 'weekly') return true;
      if (pat.frequency === 'biweekly') {
        const isoWeek = getIsoWeek(date);
        const isEvenWeek = isoWeek % 2 === 0;
        const weekNum = Math.floor(date.getDate() / 7);
        return (pat.weekParity === 'even' && isEvenWeek) ||
          (pat.weekParity === 'odd' && !isEvenWeek) ||
          (!pat.weekParity && weekNum % 2 === 0);
      }
      return false;
    }

    // ---------- Sync-Handshake: Schlüssel = Code + Geheimtoken ----------
    const generateSyncToken = () => {
      const bytes = new Uint8Array(24);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, b => b.toString(36).padStart(2, '0')).join('').slice(0, 32);
    };
    const isHelloValid = (msg, token) => !!msg && typeof msg === 'object' && msg.type === 'hello' && typeof msg.token === 'string' && msg.token.length > 0 && msg.token === token;
    const isSyncEnvelope = (msg) => !!msg && typeof msg === 'object' && msg.type === 'sync' && !!msg.data;
    const syncKeyOf = (code, token) => `${code}.${token}`;

    // Demo-Daten für die Erstinstallation: greifen nur, wenn im Browser noch keine
    // Daten gespeichert sind – bereits genutzte Apps werden nie überschrieben.
    const demoToday = new Date();
    const demoDateStr = (offsetDays) => {
      const d = new Date(demoToday);
      d.setDate(d.getDate() + offsetDays);
      return toLocalDateStr(d);
    };
    const DEMO_TS = 1704063600000;

    const INITIAL_LOCATIONS = [
      { id: 'loc-1', name: 'Hauptgebäude' },
      { id: 'loc-2', name: 'Saal B' },
      { id: 'loc-3', name: 'Werkstatt' },
      { id: 'loc-4', name: 'Außenstelle' }
    ];

    const INITIAL_SLOTS = [
      { id: 'slot-1', dayOfWeek: 1, time: '08:00' },
      { id: 'slot-2', dayOfWeek: 3, time: '14:00' },
      { id: 'slot-3', dayOfWeek: 5, time: '18:00' },
      { id: 'slot-4', dayOfWeek: 0, time: '09:30' },
      { id: 'slot-5', dayOfWeek: 6, time: '10:00' }
    ];

    const INITIAL_GROUPS = [
      { id: 'grp-demo-1', name: 'Gruppe Nord', personIds: ['p-1', 'p-3', 'p-5'], updatedAt: DEMO_TS },
      { id: 'grp-demo-2', name: 'Gruppe Süd', personIds: ['p-2', 'p-4', 'p-6'], updatedAt: DEMO_TS }
    ];

    const INITIAL_PATTERNS = [
      { id: 'pat-1', slotId: 'slot-1', locationId: 'loc-1', frequency: 'weekly', weekParity: null, monthlyMode: null, monthlyDay: null, monthlyWeek: null, monthlyWeekDay: null, groupIds: [], updatedAt: DEMO_TS },
      { id: 'pat-2', slotId: 'slot-2', locationId: 'loc-2', frequency: 'biweekly', weekParity: 'even', monthlyMode: null, monthlyDay: null, monthlyWeek: null, monthlyWeekDay: null, groupIds: [], updatedAt: DEMO_TS },
      { id: 'pat-3', slotId: 'slot-3', locationId: 'loc-2', frequency: 'monthly', weekParity: null, monthlyMode: 'dayOfMonth', monthlyDay: 1, monthlyWeek: null, monthlyWeekDay: null, groupIds: [], updatedAt: DEMO_TS },
      { id: 'pat-4', slotId: 'slot-4', locationId: 'loc-1', frequency: 'monthly', weekParity: null, monthlyMode: 'nthWeekday', monthlyDay: null, monthlyWeek: 1, monthlyWeekDay: 6, groupIds: [], updatedAt: DEMO_TS },
      { id: 'pat-5', slotId: 'slot-5', locationId: 'loc-3', frequency: 'weekly', weekParity: null, monthlyMode: null, monthlyDay: null, monthlyWeek: null, monthlyWeekDay: null, groupIds: ['grp-demo-1'], updatedAt: DEMO_TS }
    ];

    const INITIAL_PEOPLE = [
      { id: 'p-1', name: 'Anna Beispiel', absences: [], matrix: { 'slot-1_loc-1': true, 'slot-1_loc-2': true, 'slot-3_loc-2': true, 'slot-4_loc-1': true }, shiftRotation: null },
      { id: 'p-2', name: 'Ben Beispiel', absences: [], matrix: { 'slot-2_loc-2': true, 'slot-3_loc-2': true, 'slot-5_loc-3': true }, shiftRotation: null },
      { id: 'p-3', name: 'Clara Beispiel', absences: [], matrix: { 'slot-1_loc-1': true, 'slot-4_loc-1': true, 'slot-5_loc-3': true }, shiftRotation: null },
      { id: 'p-4', name: 'David Beispiel', absences: [], matrix: { 'slot-2_loc-1': true, 'slot-2_loc-2': true }, shiftRotation: { enabled: true, startDate: demoDateStr(0), cycle: [...DEFAULT_SHIFT_CYCLE] } },
      { id: 'p-5', name: 'Emma Beispiel', absences: [{ id: 'abs-demo-1', start: demoDateStr(10), end: demoDateStr(14), label: 'Urlaub (Beispiel)' }], matrix: { 'slot-1_loc-2': true, 'slot-3_loc-2': true, 'slot-4_loc-1': true, 'slot-5_loc-1': true }, shiftRotation: null },
      { id: 'p-6', name: 'Felix Beispiel', absences: [], matrix: { 'slot-1_loc-1': true, 'slot-2_loc-1': true, 'slot-4_loc-1': true }, shiftRotation: null }
    ];

    const buildDemoSchedule = () => {
      const tasks = [];
      const seen = new Set();
      for (let offset = 1; offset <= 14; offset++) {
        const d = new Date(demoToday);
        d.setDate(d.getDate() + offset);
        for (const pat of INITIAL_PATTERNS) {
          const slot = INITIAL_SLOTS.find(s => s.id === pat.slotId);
          if (!slot || !patternMatchesDate(pat, d, slot)) continue;
          const dateStr = demoDateStr(offset);
          const scope = (pat.groupIds || []).slice().sort().join(',');
          const id = `task-${dateStr}-${pat.slotId}-${pat.locationId}${scope ? '-grp-' + scope.replace(/,/g, '-') : ''}`;
          if (seen.has(id)) continue;
          seen.add(id);
          tasks.push({ id, dateStr, slotId: pat.slotId, locationId: pat.locationId, groupIds: [...(pat.groupIds || [])], assignedPersonId: null, assignedBy: null, isManual: false, updatedAt: DEMO_TS });
        }
      }
      const demoAssignees = ['p-1', 'p-2', 'p-5'];
      let ai = 0;
      for (const t of tasks) {
        if (!t.groupIds.length && ai < demoAssignees.length) {
          t.assignedPersonId = demoAssignees[ai];
          t.assignedBy = 'manual';
          ai++;
        }
      }
      let manualOffset = 2;
      const manualDate = new Date(demoToday);
      manualDate.setDate(manualDate.getDate() + manualOffset);
      while (manualDate.getDay() === 1) {
        manualOffset++;
        manualDate.setDate(manualDate.getDate() + 1);
      }
      tasks.push({
        id: 'manual-demo-1',
        dateStr: demoDateStr(manualOffset),
        slotId: 'slot-1',
        locationId: 'loc-2',
        groupIds: [],
        assignedPersonId: 'p-6',
        assignedBy: 'manual',
        isManual: true,
        updatedAt: DEMO_TS
      });
      return tasks;
    };
    const INITIAL_SCHEDULE = buildDemoSchedule();

    // Erkennung und Entfernung der Demo-Daten: Demo-Einträge zählen nur, wenn ID und Name
    // unverändert den Original-Demo-Daten entsprechen – vom Nutzer bearbeitete Einträge bleiben erhalten.
    const DEMO_ORIGINALS = {
      people: { 'p-1': 'Anna Beispiel', 'p-2': 'Ben Beispiel', 'p-3': 'Clara Beispiel', 'p-4': 'David Beispiel', 'p-5': 'Emma Beispiel', 'p-6': 'Felix Beispiel' },

    };
    const isDemoPerson = (p) => !!p && DEMO_ORIGINALS.people[p.id] === p.name;
    const isDemoLocation = (l) => !!l && DEMO_ORIGINALS.locations[l.id] === l.name;

    const isDemoGroup = (g) => !!g && DEMO_ORIGINALS.groups[g.id] === g.name;
    const isDemoPattern = (p) => !!p && Array.isArray(DEMO_ORIGINALS.patterns[p.id]) && DEMO_ORIGINALS.patterns[p.id][0] === p.slotId && DEMO_ORIGINALS.patterns[p.id][1] === p.locationId && DEMO_ORIGINALS.patterns[p.id][2] === p.frequency;
    const isDemoTask = (t) => !!t && t.updatedAt === DEMO_TS && typeof t.id === 'string' && (t.id.indexOf('task-') === 0 || t.id === 'manual-demo-1');

    // Entfernt alle Demo-Einträge aus einem Sync-Datenpaket (beim Senden und beim Empfangen)
    // Ereignisse-Import: erkennt in Textzeilen (DOCX/TXT) Muster wie
    // "Sonstiges | Instandhaltungstag12 Dez 2026 09:30" oder "Kreisaufseher | Dienstwoche09.-14. März, 2027"
    const EVENT_MONTHS = { jan: 0, feb: 1, mrz: 2, mär: 2, apr: 3, mai: 4, jun: 5, jul: 6, aug: 7, sep: 8, okt: 9, nov: 10, dez: 11 };
    const eventDateStr = (d, m, y) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const parseEventsFromText = (raw) => {
      const out = [];
      const MONTH_TOKEN = '(Jan|Feb|Mär|Mrz|Apr|Mai|Jun|Jul|Aug|Sep|Okt|Nov|Dez)';
      const rangeRe = new RegExp('(\\d{1,2})\\.\\s*[-–]\\s*(\\d{1,2})\\.\\s*' + MONTH_TOKEN + '[a-zä]*\\.?,?\\s*(\\d{4})', 'i');
      const singleRe = new RegExp('(\\d{1,2})\\.?\\s*' + MONTH_TOKEN + '[a-zä]*\\.?,?\\s*(\\d{4})', 'i');
      const timeRe = /(\d{1,2}:\d{2})(?:\s*[-–]\s*(\d{1,2}:\d{2}))?/;
      String(raw || '').split(/\r?\n/).forEach(line => {
        const s = line.trim();
        if (!s) return;
        let category = '';
        let rest = s;
        const pipe = s.indexOf('|');
        if (pipe > 0) { category = s.slice(0, pipe).trim(); rest = s.slice(pipe + 1).trim(); }
        const rm = rest.match(rangeRe);
        const sm = rest.match(singleRe);
        const m = rm || sm;
        if (!m) return;
        const monthTok = (rm ? m[3] : m[2]).toLowerCase().slice(0, 3);
        const month = EVENT_MONTHS[monthTok];
        if (month === undefined) return;
        const year = parseInt(rm ? m[4] : m[3], 10);
        const startDay = parseInt(m[1], 10);
        const dateStr = eventDateStr(startDay, month, year);
        let endDateStr = null;
        if (rm) {
          const endDay = parseInt(m[2], 10);
          if (endDay > startDay) endDateStr = eventDateStr(endDay, month, year);
        }
        const before = rest.slice(0, m.index).trim();
        const after = rest.slice(m.index + m[0].length).trim();
        let time = null, timeEnd = null, note = after;
        const tm = after.match(timeRe);
        if (tm) {
          time = tm[1];
          timeEnd = tm[2] || null;
          note = (after.slice(0, tm.index) + after.slice(tm.index + tm[0].length)).trim();
        }
        const title = before || category || 'Ereignis';
        out.push({ id: `evt-${Date.now()}-${Math.random()}`, dateStr, endDateStr, title, category, time, timeEnd, note });
      });
      return out;
    };

    const stripDemoData = (data) => {
      if (!data || typeof data !== 'object') return { cleaned: data, removed: 0 };
      let removed = 0;
      const cut = (arr, fn) => {
        if (!Array.isArray(arr)) return arr;
        const kept = arr.filter(x => !fn(x));
        removed += arr.length - kept.length;
        return kept;
      };
      const cleaned = {
        locations: cut(data.locations, isDemoLocation),
        timeSlots: cut(data.timeSlots, isDemoSlot),
        patterns: cut(data.patterns, isDemoPattern),
        groups: cut(data.groups, isDemoGroup),
        schedule: cut(data.schedule, isDemoTask),
        people: (() => {
          if (!Array.isArray(data.people)) return data.people;
          const kept = [];
          data.people.forEach(p => {
            if (!p) return;
            if (isDemoPerson(p)) { removed++; return; }
            if (Array.isArray(p.absences) && p.absences.some(a => a && a.id === 'abs-demo-1')) {
              removed++;
              kept.push({ ...p, absences: p.absences.filter(a => !a || a.id !== 'abs-demo-1') });
              return;
            }
            kept.push(p);
          });
          return kept;
        })(),
        events: cut(data.events, () => false),
        tombstones: data.tombstones,
        settings: data.settings,
        appVersion: data.appVersion
      };
      return { cleaned, removed };
    };

    // Interaktives Tutorial: geführte Einführung, wechselt automatisch in den passenden Tab
    const TUTORIAL_STEPS = [

      { tab: 'calendar', title: 'Beispieldaten 🧹', text: ['Damit Sie alles gefahrlos ausprobieren können, enthält die frisch installierte App anonyme Beispieldaten.', 'Sie verschwinden automatisch beim ersten Import von Abwesenheiten oder Ereignissen (ein Pop-up fragt vorher nach) – oder einzeln per Löschen bzw. über die Gefahrenzone in den Stammdaten.'] },
      { tab: 'calendar', title: 'Planer & Kalender 🗓️', text: ['Der Monatskalender zeigt alle Termine mit farbigen Namens-Chips (mobil als Akronym).', 'Tippen Sie auf einen Tag: rechts öffnet sich das Aufgaben-Panel mit „+ Aufgabe anlegen“, der klickbaren ⭐ Empfehlung und der Verfügbarkeits-Liste mit Gründen (z. B. „Schicht: Früh“ oder „Abwesend/Urlaub“).', 'Die 6 nummerierten Schaltflächen über dem Kalender sind Ihr Monatsrhythmus: erst Importe, dann Termine generieren, dann Personen zuteilen.'] },
      { tab: 'calendar', title: 'Import aus NW Scheduler 📥', text: ['Die Schaltflächen „1. Abwesenheiten importieren“ und „2. Ereignisse importieren“ sind für den Export aus dem NW Scheduler vorgesehen.', 'Abwesenheiten: NW Scheduler → Berichte → Personen → „Person Abwesenheiten“ → als Dokument (PDF/DOCX) speichern und hier importieren.', 'Ereignisse: Berichte → Versammlung → „Versammlungsereignisse“ mit gewünschtem Zeitraum → als Dokument (DOCX/TXT) speichern und hier importieren.'], images: [{ src: './docs/nw-scheduler-export-abwesenheiten.png', caption: 'NW Scheduler 8.2: Export „Person Abwesenheiten“ (Bericht → Personen)' }, { src: './docs/nw-scheduler-export-ereignisse.png', caption: 'NW Scheduler 8.2: Export „Versammlungsereignisse“ (Bericht → Versammlung, mit Zeitraum)' }] },

      { tab: 'people', title: 'Schichtrhythmus 🔄', text: ['Wer extern im 3-Schicht-System arbeitet, wird automatisch gesperrt, solange eine Schicht läuft.', 'Schichtrhythmus aktivieren, Startdatum angeben und die Reihenfolge anklicken (Kachel: Frei → Früh → Spät → Nacht). Das Muster läuft unbegrenzt weiter.', 'Blockierungen: Früh 06–14 Uhr · Spät 14–22 Uhr · Nacht 22–06 Uhr und am Folgetag bis 14 Uhr.'] },

      { tab: 'stats', title: 'Statistik 📊', text: ['Hier sehen Sie pro Person, wie oft sie eingeteilt wurde – so prüfen Sie, ob die Verteilung ausgeglichen ist.', 'Die automatische Zuteilung bevorzugt die längste Pause, dann die geringste Gesamtzahl, dann Wochentags-Balance.'] },

      { tab: 'calendar', title: 'Als App installieren 📲', text: ['Die App ist als PWA installierbar und läuft danach auch offline (Android: Menü → „App installieren“ · iPhone: Teilen → „Zum Home-Bildschirm“).', 'Erscheint eine neue Version, meldet das gelbe Update-Banner oben – „Jetzt aktualisieren“ lädt sie.', 'Die Versionsnummer steht klein neben dem Sync-Button.'] },
      { tab: 'calendar', title: 'Los geht’s! ✅', text: ['Viel Erfolg beim Planen!', 'Diese Einführung können Sie jederzeit über den ❓-Button in der Kopfzeile erneut öffnen – Details stehen auch im Tutorial-Dokument und in der README.'] }
    ];

    function App() {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [activeTab, setActiveTab] = useState('calendar');
      
      const [locations, setLocations] = useState(() => JSON.parse(localStorage.getItem('app_locs')) || INITIAL_LOCATIONS);

      const [people, setPeople] = useState(() => (JSON.parse(localStorage.getItem('app_people')) || INITIAL_PEOPLE).sort((a, b) => a.name.localeCompare(b.name, 'de')));
      const [schedule, setSchedule] = useState(() => JSON.parse(localStorage.getItem('app_sched')) || INITIAL_SCHEDULE);

      const [selectedDateStr, setSelectedDateStr] = useState('2026-11-04');

      const [toast, setToast] = useState(null);

      // Gruppen-Optionen: automatische Zuteilung von Gruppenterminen + ob sie in die Verteilungsbilanz zählen
      const [settings, setSettings] = useState(() => {
        try {
          const stored = JSON.parse(localStorage.getItem('app_settings'));
          if (stored && typeof stored === 'object' && !Array.isArray(stored)) return { autoAssignGroups: false, groupsCountInStats: false, updatedAt: 0, ...stored };
        } catch (err) {}
        return { autoAssignGroups: false, groupsCountInStats: false, updatedAt: 0 };
      });
      useEffect(() => localStorage.setItem('app_settings', JSON.stringify(settings)), [settings]);
      const [groups, setGroups] = useState(() => JSON.parse(localStorage.getItem('app_groups')) || INITIAL_GROUPS);
      const [events, setEvents] = useState(() => JSON.parse(localStorage.getItem('app_events')) || []);
      useEffect(() => localStorage.setItem('app_groups', JSON.stringify(groups)), [groups]);

      // Lösch-Markierungen (Tombstones): Gelöschte IDs werden gemerkt und mit synchronisiert,
      // damit Löschungen auf anderen Geräten nicht durch den Union-Merge wiederhergestellt werden.
      const TOMBSTONE_COLLECTIONS = ['locations', 'timeSlots', 'patterns', 'groups', 'people', 'schedule', 'absences', 'events'];
      const normalizeTombstones = (raw) => {
        const base = {};
        TOMBSTONE_COLLECTIONS.forEach(c => { base[c] = {}; });
        if (!raw || typeof raw !== 'object') return base;
        TOMBSTONE_COLLECTIONS.forEach(c => {
          const entry = raw[c];
          const map = {};
          if (Array.isArray(entry)) {
            entry.forEach(id => { if (typeof id === 'string' && id) map[id] = 0; });
          } else if (entry && typeof entry === 'object') {
            Object.entries(entry).forEach(([id, ts]) => { if (id && typeof ts === 'number') map[id] = ts; });
          }
          const ids = Object.keys(map);
          if (ids.length > 500) {
            ids.sort((a, b) => map[a] - map[b]).slice(0, ids.length - 500).forEach(id => { delete map[id]; });
          }
          base[c] = map;
        });
        return base;
      };
      const [tombstones, setTombstones] = useState(() => normalizeTombstones(JSON.parse(localStorage.getItem('app_tombstones'))));
      const markDeleted = (collection, id) => {
        if (!id || !TOMBSTONE_COLLECTIONS.includes(collection)) return;
        setTombstones(prev => normalizeTombstones({ ...prev, [collection]: { ...(prev[collection] || {}), [id]: Date.now() } }));

      useEffect(() => localStorage.setItem('app_tombstones', JSON.stringify(tombstones)), [tombstones]);
      useEffect(() => localStorage.setItem('app_events', JSON.stringify(events)), [events]);

      // PWA: Service Worker registrieren und periodisch nach einer neuen Server-Version prüfen
      useEffect(() => {

        const checkVersion = async () => {

            if (!res.ok) return;

            setUpdateAvailable(!!data.version && isNewerVersion(data.version, APP_VERSION));

        };
        checkVersion();
        const interval = setInterval(checkVersion, 5 * 60 * 1000);
        window.addEventListener('focus', checkVersion);
        return () => {
          clearInterval(interval);
          window.removeEventListener('focus', checkVersion);
        };
      }, []);

      const showToast = (msg, type = 'info') => {

      // Banner nach Import: listet die Änderungen kurz auf und verschwindet automatisch
      const [importBanner, setImportBanner] = useState(null);
      useEffect(() => {

      // ---------- Interaktives Tutorial ----------
      const [tutorialOpen, setTutorialOpen] = useState(() => !localStorage.getItem('app_tutorial_done'));
      const [tutorialStep, setTutorialStep] = useState(0);
      useEffect(() => {

      }, [tutorialStep, tutorialOpen]);
      const closeTutorial = () => {
        setTutorialOpen(false);
        localStorage.setItem('app_tutorial_done', '1');
      };

      // ---------- Lokaler KI-Erklär-Assistent: Zustand ----------
      const [assistantOpen, setAssistantOpen] = useState(false);
      const [aiPhase, setAiPhase] = useState('idle');
      const [aiProgress, setAiProgress] = useState(0);
      const [aiNote, setAiNote] = useState('');
      const [aiModelId, setAiModelId] = useState(AI_MODELS[1].id);
      const [aiMessages, setAiMessages] = useState([]);
      const [aiInput, setAiInput] = useState('');
      const [aiBusy, setAiBusy] = useState(false);
      const aiEngineRef = useRef(null);
      const aiLoadedModelRef = useRef(null);
      const aiChatRef = useRef(null);
      const aiBusyRef = useRef(false);

      // ---------- Geräte-Sync (WebRTC Data Channels via PeerJS) ----------
      const SYNC_PREFIX = 'aufgabenplaner-';

      const collectSyncData = () => stripDemoData({ appVersion: APP_VERSION, locations, timeSlots, patterns, groups, people, schedule, events, settings, tombstones }).cleaned;

      const mergeById = (local, incoming) => {
        const map = new Map((local || []).map(item => [item.id, item]));
        (incoming || []).forEach(item => { if (item && item.id && !map.has(item.id)) map.set(item.id, item); });
        return [...map.values()];
      };

      // Termine: Last-Update-wins – neuere Änderungen (z. B. Zuteilungen) setzen sich durch
      const mergeTasks = (local, incoming) => {
        const map = new Map((local || []).map(item => [item.id, item]));
        (incoming || []).forEach(item => {
          if (!item || !item.id) return;
          const cur = map.get(item.id);
          if (!cur || (item.updatedAt || 0) > (cur.updatedAt || 0)) map.set(item.id, item);
        });
        return [...map.values()];
      };

      const addSyncLog = (direction, text) => {
        setSyncLog(prev => [...prev.slice(-199), { time: new Date().toLocaleTimeString('de-DE'), direction, text }]);
      };

      // Stabler Vergleich (Schlüssel sortiert), um unnötige State-Updates und Echo-Sends zu vermeiden
      const stableStringify = (v) => {
        if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
        if (v && typeof v === 'object') {
          return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
        }
        return JSON.stringify(v);
      };

      const applySyncData = (data) => {
        if (!data || typeof data !== 'object') return;
        suppressSendRef.current = true;
        const { cleaned: incoming, removed: incomingDemoRemoved } = stripDemoData(data);

        TOMBSTONE_COLLECTIONS.forEach(c => {

        const isDeleted = (collection, id, updatedAt) => {

        const revive = (collection, id) => { delete mergedTombstones[collection][id]; };

        const added = { locations: 0, timeSlots: 0, patterns: 0, groups: 0, people: 0, schedule: 0, events: 0, deletions: 0 };
        let changed = false;

          const keptLocal = baseLocations.filter(l => !isDeleted('locations', l.id, l.updatedAt));
          added.deletions += baseLocations.length - keptLocal.length;
          added.locations = filtered.filter(i => !baseLocations.some(l => l.id === i.id)).length;
          const next = mergeById(keptLocal, filtered);
          if (stableStringify(next) !== stableStringify(baseLocations)) { changed = true; setLocations(next); }
        }
        if (Array.isArray(incoming.timeSlots)) {
          const filtered = incoming.timeSlots.filter(i => i && i.id && !isDeleted('timeSlots', i.id, i.updatedAt));

          const keptLocal = baseTimeSlots.filter(l => !isDeleted('timeSlots', l.id, l.updatedAt));
          added.deletions += baseTimeSlots.length - keptLocal.length;

          added.patterns = filtered.filter(i => !basePatterns.some(l => l.id === i.id)).length;

        if (Array.isArray(incoming.groups)) {

          added.deletions += baseGroups.length - keptLocal.length;

        if (Array.isArray(incoming.events)) {

          const keptLocal = (events || []).filter(l => !isDeleted('events', l.id, l.updatedAt));
          added.deletions += (events || []).length - keptLocal.length;
          added.events = filtered.filter(i => !(events || []).some(l => l.id === i.id)).length;
          const next = mergeById(keptLocal, filtered);

        if (Array.isArray(incoming.schedule)) {
          const filtered = incoming.schedule.filter(i => i && i.id && !isDeleted('schedule', i.id, i.updatedAt));
          filtered.forEach(i => { if (i.updatedAt) revive('schedule', i.id); });
          const keptLocal = baseSchedule.filter(l => !isDeleted('schedule', l.id, l.updatedAt));
          added.deletions += baseSchedule.length - keptLocal.length;
          added.schedule = filtered.filter(i => !baseSchedule.some(l => l.id === i.id)).length;
          const next = mergeTasks(keptLocal, filtered);

        }
        if (Array.isArray(incoming.people)) {
          const keptLocalPeople = basePeople.filter(p => !isDeleted('people', p.id, p.updatedAt));

        if (stableStringify(mergedTombstones) !== stableStringify(tombstones)) {

      };;

      const PAIRING_KEY = 'app_sync_pairing';

      const getPairing = () => {

      const teardownSync = () => {

        if (connectTimerRef.current) clearTimeout(connectTimerRef.current);
        reconnectAttemptsRef.current += 1;
        connectTimerRef.current = setTimeout(() => {
          connectTimerRef.current = null;

      const attachConnHandlers = (conn, token) => {
        conn.__verified = false;
        conn.on('open', () => {
          reconnectAttemptsRef.current = 0;
          setSync(s => (s ? { ...s, status: 'connecting' } : s));
          addSyncLog('info', 'Verbindung hergestellt – Gegenstelle wird authentifiziert…');
          conn.send({ type: 'hello', token });
        });
        conn.on('data', (data) => {
          if (!conn.__verified) {

              setSync(s => (s ? { ...s, status: 'connected' } : s));
              addSyncLog('info', 'Gegenstelle authentifiziert – Anfangsabgleich läuft');
              conn.send({ type: 'sync', data: collectSyncData() });

              try { conn.close(); } catch (err) {}
            }
            return;

          if (isSyncEnvelope(data)) applySyncData(data.data);

        conn.on('close', () => {
          if (syncConnRef.current !== conn) return;
          setSync(s => (s && s.status === 'connected' ? { ...s, status: 'closed' } : s));
          addSyncLog('info', 'Verbindung getrennt – automatischer Wiederaufbau läuft…');

          if (pairing) scheduleReconnect(pairing.role, pairing.code, pairing.token, 3000);

      const establishSync = (role, code, token) => {
        if (typeof Peer === 'undefined') {

          return;
        }
        const existingPeer = syncPeerRef.current;
        if (existingPeer && !existingPeer.destroyed) {
          const curConn = syncConnRef.current;
          if (curConn && !curConn.destroyed && curConn.open) return;
          if (!existingPeer.disconnected) {
            if (role === 'client') {
              setSync(s => (s ? { ...s, status: 'connecting' } : s));
              const newConn = existingPeer.connect(SYNC_PREFIX + code, { reliable: true });
              syncConnRef.current = newConn;
              attachConnHandlers(newConn, token);
            }
            return;
          }
          try { existingPeer.reconnect(); return; } catch (err) {}
          teardownSync();
        } else if (existingPeer) {

        setSync({ role, code, token, status: role === 'host' ? 'waiting' : 'connecting' });
        const peerOptions = {

            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
              { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
              { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }

            const conn = peer.connect(SYNC_PREFIX + code, { reliable: true });
            syncConnRef.current = conn;
            attachConnHandlers(conn, token);

      useEffect(() => {

      useEffect(() => {

      const eventsByDate = useMemo(() => {
