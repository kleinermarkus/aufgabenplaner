<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, createElement: h } = React;

    const APP_VERSION = '1.1.0';

    const DAY_NAMES = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

    // Externes 3-Schicht-System: Frühschicht (06-14), Spätschicht (14-22), Nachtschicht (22-06)
    // Nachtschicht blockiert zusätzlich den Folgetag bis 14 Uhr (Frühfenster).
    const SHIFT_DEFS = {
      frueh: { label: 'Frühschicht', short: 'F', color: 'bg-amber-100 text-amber-800 border-amber-300' },
      spaet: { label: 'Spätschicht', short: 'S', color: 'bg-sky-100 text-sky-800 border-sky-300' },
      nacht: { label: 'Nachtschicht', short: 'N', color: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
      frei: { label: 'Frei', short: '–', color: 'bg-slate-100 text-slate-500 border-slate-300' }
    };
    const SHIFT_CYCLE_ORDER = ['frei', 'frueh', 'spaet', 'nacht'];
    const DEFAULT_SHIFT_CYCLE = ['frueh', 'frueh', 'spaet', 'spaet', 'nacht', 'nacht', 'frei', 'frei'];

    // Externe Schicht einer Person an einem Datum (Rotation ab Startdatum, null = keine Einschränkung)
    function getExternalShiftForDate(person, dateStr) {
      const rot = person?.shiftRotation;
      if (!rot?.enabled || !rot.startDate || !Array.isArray(rot.cycle) || rot.cycle.length === 0) return null;
      const diff = Math.floor((parseLocalDate(dateStr) - parseLocalDate(rot.startDate)) / 86400000);
      if (diff < 0) return null;
      const shift = rot.cycle[diff % rot.cycle.length];
      return shift && shift !== 'frei' ? shift : null;
    }

    // Liefert Label der blockierenden Schicht oder null, wenn die Person den Zeitslot wahrnehmen kann
    function getExternalShiftBlock(person, dateStr, slotTime) {
      const parts = String(slotTime || '').split(':');
      const hour = parseInt(parts[0], 10) + parseInt(parts[1] || '0', 10) / 60;
      if (isNaN(hour)) return null;
      const today = getExternalShiftForDate(person, dateStr);
      const yesterdayStr = toLocalDateStr(new Date(parseLocalDate(dateStr).getTime() - 86400000));
      const yesterday = getExternalShiftForDate(person, yesterdayStr);
      if (today === 'frueh' && hour >= 6 && hour < 14) return 'Frühschicht';
      if (today === 'spaet' && hour >= 14 && hour < 22) return 'Spätschicht';
      if (today === 'nacht' && hour >= 22) return 'Nachtschicht';
      if (yesterday === 'nacht' && hour < 14) return 'Nachtschicht (Folgetag)';
      return null;
    }

    // Sächsische Feiertage dynamisch berechnen
    
    // ISO Kalenderwoche berechnen
    function getIsoWeek(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
    }

    
    // Lokales Datum im Format YYYY-MM-DD erzeugen (verhindert Zeitzonen-Verschiebungen durch toISOString)
    
    // Datum aus YYYY-MM-DD string lokal erzeugen (verhindert Zeitzonen-Verschiebungen)
    function parseLocalDate(dateStr) {
      if (!dateStr) return new Date();
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      }
      return new Date(dateStr);
    }

    function toLocalDateStr(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getGermanHolidaysSaxony(year) {
      const getEaster = (y) => {
        const a = y % 19, b = Math.floor(y / 100), c = y % 100;
        const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4), k = c % 4, L = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * L) / 451);
        const month = Math.floor((h + L - 7 * m + 114) / 31);
        const day = ((h + L - 7 * m + 114) % 31) + 1;
        return new Date(y, month - 1, day);
      };

      const format = (d) => toLocalDateStr(d);
      const addDays = (d, days) => {
        const res = new Date(d);
        res.setDate(res.getDate() + days);
        return res;
      };

      const easter = getEaster(year);
      const holidays = {
        [`${year}-01-01`]: 'Neujahr',
        [`${year}-05-01`]: 'Tag der Arbeit',
        [`${year}-10-03`]: 'Tag der Deutschen Einheit',
        [`${year}-10-31`]: 'Reformationstag',
        [`${year}-12-25`]: '1. Weihnachtstag',
        [`${year}-12-26`]: '2. Weihnachtstag',
        [format(addDays(easter, -2))]: 'Karfreitag',
        [format(addDays(easter, 1))]: 'Ostermontag',
        [format(addDays(easter, 39))]: 'Christi Himmelfahrt',
        [format(addDays(easter, 50))]: 'Pfingstmontag',
      };

      const nov23 = new Date(year, 10, 23);
      let bussBettag = new Date(nov23);
      let dayOfWeek = bussBettag.getDay();
      let diff = dayOfWeek >= 3 ? dayOfWeek - 3 : 7 - (3 - dayOfWeek);
      if (diff === 0) diff = 7;
      bussBettag.setDate(bussBettag.getDate() - diff);
      holidays[format(bussBettag)] = 'Buß- und Bettag';

      return holidays;
    }

    const INITIAL_LOCATIONS = [
      { id: 'loc-1', name: 'Hauptgebäude' },
      { id: 'loc-2', name: 'Saal B' },
      { id: 'loc-3', name: 'Außenstelle' }
    ];

    const INITIAL_SLOTS = [
      { id: 'slot-1', dayOfWeek: 1, time: '08:00' },
      { id: 'slot-2', dayOfWeek: 3, time: '14:00' },
      { id: 'slot-3', dayOfWeek: 5, time: '18:00' },
      { id: 'slot-4', dayOfWeek: 0, time: '09:30' }
    ];

    const INITIAL_PATTERNS = [
      { id: 'pat-1', slotId: 'slot-1', locationId: 'loc-1', frequency: 'weekly' },
      { id: 'pat-2', slotId: 'slot-2', locationId: 'loc-2', frequency: 'biweekly' },
      { id: 'pat-3', slotId: 'slot-3', locationId: 'loc-2', frequency: 'weekly' },
      { id: 'pat-4', slotId: 'slot-4', locationId: 'loc-1', frequency: 'weekly' }
    ];

    const INITIAL_PEOPLE = [
      { id: 'p-1', name: 'Markus Pauli', absences: [], matrix: { 'slot-1_loc-1': true, 'slot-3_loc-2': true } },
      { id: 'p-2', name: 'Anna', absences: [], matrix: { 'slot-1_loc-1': true, 'slot-3_loc-2': true } },
      { id: 'p-3', name: 'Ben', absences: [], matrix: { 'slot-2_loc-2': true, 'slot-3_loc-2': true } },
      { id: 'p-4', name: 'Clara', absences: [], matrix: { 'slot-4_loc-1': true, 'slot-1_loc-1': true } }
    ];

    function App() {
      const [currentDate, setCurrentDate] = useState(new Date(2026, 10, 1));
      const [activeTab, setActiveTab] = useState('calendar');
      
      const [locations, setLocations] = useState(() => JSON.parse(localStorage.getItem('app_locs')) || INITIAL_LOCATIONS);
      const [timeSlots, setTimeSlots] = useState(() => JSON.parse(localStorage.getItem('app_slots')) || INITIAL_SLOTS);
      const [patterns, setPatterns] = useState(() => JSON.parse(localStorage.getItem('app_pats')) || INITIAL_PATTERNS);
      const [people, setPeople] = useState(() => (JSON.parse(localStorage.getItem('app_people')) || INITIAL_PEOPLE).sort((a, b) => a.name.localeCompare(b.name, 'de')));
      const [schedule, setSchedule] = useState(() => JSON.parse(localStorage.getItem('app_sched')) || []);

      const [selectedDateStr, setSelectedDateStr] = useState('2026-11-04');
      const [editingTask, setEditingTask] = useState(null);
      const [newPersonName, setNewPersonName] = useState('');

      // Form States
      const [newLocName, setNewLocName] = useState('');
      const [newSlotDay, setNewSlotDay] = useState(1);
      const [newSlotTime, setNewSlotTime] = useState('09:00');
      const [newPatSlot, setNewPatSlot] = useState('');
      const [newPatLoc, setNewPatLoc] = useState('');
      const [newPatFreq, setNewPatFreq] = useState('weekly');
      const [newPatParity, setNewPatParity] = useState('even');
      const [editingPattern, setEditingPattern] = useState(null);

      // State für manuelle Abwesenheiten pro Person
      const [manualAbsence, setManualAbsence] = useState({});
      const [editingAbsence, setEditingAbsence] = useState(null);

      const [toast, setToast] = useState(null);
      const [updateAvailable, setUpdateAvailable] = useState(false);

      useEffect(() => localStorage.setItem('app_locs', JSON.stringify(locations)), [locations]);
      useEffect(() => localStorage.setItem('app_slots', JSON.stringify(timeSlots)), [timeSlots]);
      useEffect(() => localStorage.setItem('app_pats', JSON.stringify(patterns)), [patterns]);
      useEffect(() => localStorage.setItem('app_people', JSON.stringify(people)), [people]);
      useEffect(() => localStorage.setItem('app_sched', JSON.stringify(schedule)), [schedule]);

      // PWA: Service Worker registrieren und periodisch nach einer neuen Server-Version prüfen
      useEffect(() => {
        if (!location.protocol.startsWith('http')) return;
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        }
        const checkVersion = async () => {
          try {
            const res = await fetch(`version.json?ts=${Date.now()}`, { cache: 'no-store' });
            if (!res.ok) return;
            const data = await res.json();
            if (data.version && data.version !== APP_VERSION) setUpdateAvailable(true);
          } catch (err) {}
        };
        checkVersion();
        const interval = setInterval(checkVersion, 5 * 60 * 1000);
        window.addEventListener('focus', checkVersion);
        return () => {
          clearInterval(interval);
          window.removeEventListener('focus', checkVersion);
        };
      }, []);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const holidays = useMemo(() => getGermanHolidaysSaxony(year), [year]);

      const getPersonAvailabilityDetails = (person, slotId, locationId, dateStr) => {
        const slot = timeSlots.find(s => s.id === slotId);
        if (!slot) return { isAvailable: false, reason: 'Ungültiger Zeitslot' };

        const isAbsent = person.absences?.some(abs => dateStr >= abs.start && dateStr <= abs.end);
        if (isAbsent) return { isAvailable: false, reason: 'Abwesend/Urlaub' };

        const shiftBlock = getExternalShiftBlock(person, dateStr, slot.time);
        if (shiftBlock) {
          return { isAvailable: false, reason: `Schicht: ${shiftBlock}` };
        }

        const matchSlot = timeSlots.find(s => s.dayOfWeek === slot.dayOfWeek && s.time === slot.time);
        if (!matchSlot) return { isAvailable: false, reason: 'Kein passender Slot' };

        const matrixKey = `${matchSlot.id}_${locationId}`;
        const isQualified = !!person.matrix?.[matrixKey];
        if (!isQualified) return { isAvailable: false, reason: 'Nicht für diesen Ort/Zeitslot qualifiziert' };

        return { isAvailable: true, reason: 'Verfügbar' };
      };

      const getRecommendedPersonIdForTask = (task) => {
        const counts = {};
        const weekdayCounts = {};
        const lastAssignedDate = {};
        people.forEach(p => {
          counts[p.id] = 0;
          weekdayCounts[p.id] = {};
          for (let i = 0; i < 7; i++) weekdayCounts[p.id][i] = 0;
          lastAssignedDate[p.id] = null;
        });
        schedule.forEach(t => {
          if (t.assignedPersonId && counts[t.assignedPersonId] !== undefined) {
            counts[t.assignedPersonId]++;
            const taskDate = parseLocalDate(t.dateStr);
            const wDay = taskDate.getDay();
            weekdayCounts[t.assignedPersonId][wDay] = (weekdayCounts[t.assignedPersonId][wDay] || 0) + 1;
            if (!lastAssignedDate[t.assignedPersonId] || t.dateStr > lastAssignedDate[t.assignedPersonId]) {
              lastAssignedDate[t.assignedPersonId] = t.dateStr;
            }
          }
        });

        const candidates = people.filter(p => {
          const details = getPersonAvailabilityDetails(p, task.slotId, task.locationId, task.dateStr);
          return details.isAvailable;
        });
        if (candidates.length === 0) return null;

        const taskDate = parseLocalDate(task.dateStr);
        const taskWDay = taskDate.getDay();

        candidates.sort((a, b) => {
          const diffCount = counts[a.id] - counts[b.id];
          if (diffCount !== 0) return diffCount;

          const lastA = lastAssignedDate[a.id] ? parseLocalDate(lastAssignedDate[a.id]) : null;
          const lastB = lastAssignedDate[b.id] ? parseLocalDate(lastAssignedDate[b.id]) : null;
          const daysA = lastA ? (taskDate - lastA) / (1000 * 60 * 60 * 24) : 9999;
          const daysB = lastB ? (taskDate - lastB) / (1000 * 60 * 60 * 24) : 9999;

          if (Math.abs(daysA - daysB) > 0.5) {
            return daysB - daysA;
          }

          const diffWDay = (weekdayCounts[a.id][taskWDay] || 0) - (weekdayCounts[b.id][taskWDay] || 0);
          if (diffWDay !== 0) return diffWDay;

          return a.name.localeCompare(b.name, 'de');
        });

        return candidates[0].id;
      };

      // 1. Termine generieren (Vollständige Kalenderwochen einbeziehen + Duplikatsprüfung)
      const generateDates = () => {
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        // Starte am Montag der ersten Kalenderwoche des Monats
        let start = new Date(firstDay);
        let dayOfWeek = start.getDay();
        let distanceToMon = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
        start.setDate(start.getDate() - distanceToMon);

        // Ende am Sonntag der letzten Kalenderwoche des Monats
        let end = new Date(lastDay);
        dayOfWeek = end.getDay();
        let distanceToSun = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
        end.setDate(end.getDate() + distanceToSun);

        const newTasks = [];
        let curr = new Date(start);

        while (curr <= end) {
          const dateStr = toLocalDateStr(curr);
          const currDay = curr.getDay();
          const weekNum = Math.floor(curr.getDate() / 7);

          patterns.forEach(pat => {
            const slot = timeSlots.find(s => s.id === pat.slotId);
            if (slot && slot.dayOfWeek === currDay) {
              const isoWeek = getIsoWeek(curr);
              const isEvenWeek = isoWeek % 2 === 0;
              const matchesBiweekly = pat.frequency === 'biweekly' && (
                (pat.weekParity === 'even' && isEvenWeek) || 
                (pat.weekParity === 'odd' && !isEvenWeek) ||
                (!pat.weekParity && weekNum % 2 === 0)
              );
              if (pat.frequency === 'weekly' || matchesBiweekly) {
                // Duplikatsprüfung: Prüfen ob Task mit gleichem Datum, Zeitslot und Ort bereits existiert
                const exists = schedule.some(t => t.dateStr === dateStr && t.slotId === pat.slotId && t.locationId === pat.locationId);
                if (!exists) {
                  newTasks.push({
                    id: `task-${dateStr}-${pat.slotId}-${pat.locationId}`,
                    dateStr,
                    slotId: pat.slotId,
                    locationId: pat.locationId,
                    assignedPersonId: null,
                    isManual: false
                  });
                }
              }
            }
          });
          curr.setDate(curr.getDate() + 1);
        }

        if (newTasks.length > 0) {
          setSchedule(prev => [...prev, ...newTasks]);
          showToast(`${newTasks.length} neue Termine generiert (vollständige KW berücksichtigt).`, 'success');
        } else {
          showToast('Keine neuen Termine generiert (alle passenden Termine existieren bereits).', 'info');
        }
      };

      // 2. Personen zuteilen
      const assignPeople = () => {
        let updatedSchedule = [...schedule];

        // 1. Termine chronologisch sortieren für korrekte zeitliche Abstands- und Wochentags-Berechnung
        updatedSchedule.sort((a, b) => {
          if (a.dateStr !== b.dateStr) return a.dateStr.localeCompare(b.dateStr);
          const sA = timeSlots.find(s => s.id === a.slotId)?.time || '';
          const sB = timeSlots.find(s => s.id === b.slotId)?.time || '';
          return sA.localeCompare(sB);
        });

        let unassigned = updatedSchedule.filter(t => !t.assignedPersonId);
        if (unassigned.length === 0) {
          showToast('Keine unbesetzten Aufgaben vorhanden.', 'info');
          return;
        }

        // Zähler, Wochentags-Zähler und Datum des letzten Einsatzes initialisieren
        const counts = {};
        const weekdayCounts = {};
        const lastAssignedDate = {};

        people.forEach(p => {
          counts[p.id] = 0;
          weekdayCounts[p.id] = {};
          for (let i = 0; i < 7; i++) weekdayCounts[p.id][i] = 0;
          lastAssignedDate[p.id] = null;
        });

        // Bestehende Zuteilungen einlesen
        updatedSchedule.forEach(t => {
          if (t.assignedPersonId && counts[t.assignedPersonId] !== undefined) {
            counts[t.assignedPersonId]++;
            const taskDate = parseLocalDate(t.dateStr);
            const wDay = taskDate.getDay();
            weekdayCounts[t.assignedPersonId][wDay] = (weekdayCounts[t.assignedPersonId][wDay] || 0) + 1;

            if (!lastAssignedDate[t.assignedPersonId] || t.dateStr > lastAssignedDate[t.assignedPersonId]) {
              lastAssignedDate[t.assignedPersonId] = t.dateStr;
            }
          }
        });

        let assignedCount = 0;
        updatedSchedule = updatedSchedule.map(task => {
          if (task.assignedPersonId) return task;

          const candidates = people.filter(p => {
            const details = getPersonAvailabilityDetails(p, task.slotId, task.locationId, task.dateStr);
            return details.isAvailable;
          });

          if (candidates.length > 0) {
            const taskDate = parseLocalDate(task.dateStr);
            const taskWDay = taskDate.getDay();

            candidates.sort((a, b) => {
              // 1. Primär: Gesamtanzahl Einsätze (Wer weniger hat, wird bevorzugt)
              const diffCount = counts[a.id] - counts[b.id];
              if (diffCount !== 0) return diffCount;

              // 2. Sekundär: Zeitlicher Abstand / Pause (Wer länger Pause hatte, wird streng bevorzugt)
              const lastA = lastAssignedDate[a.id] ? parseLocalDate(lastAssignedDate[a.id]) : null;
              const lastB = lastAssignedDate[b.id] ? parseLocalDate(lastAssignedDate[b.id]) : null;

              const daysA = lastA ? (taskDate - lastA) / (1000 * 60 * 60 * 24) : 9999;
              const daysB = lastB ? (taskDate - lastB) / (1000 * 60 * 60 * 24) : 9999;

              if (Math.abs(daysA - daysB) > 0.5) {
                return daysB - daysA;
              }

              // 3. Tertiär: Wochentags-Balance (Wer an diesem Wochentag bisher seltener dran war)
              const diffWDay = (weekdayCounts[a.id][taskWDay] || 0) - (weekdayCounts[b.id][taskWDay] || 0);
              if (diffWDay !== 0) return diffWDay;

              // 4. Quaternär: Alphabetisch / Zufall
              return a.name.localeCompare(b.name, 'de');
            });

            const chosen = candidates[0];
            counts[chosen.id]++;
            weekdayCounts[chosen.id][taskWDay] = (weekdayCounts[chosen.id][taskWDay] || 0) + 1;
            lastAssignedDate[chosen.id] = task.dateStr;
            assignedCount++;
            return { ...task, assignedPersonId: chosen.id };
          }
          return task;
        });

        setSchedule(updatedSchedule);
        showToast(`${assignedCount} Aufgaben unter Berücksichtigung von Wochentags-Balance, Pausen und Fairness zugeteilt.`, 'success');
      };

      // PDF Drucken / Exportieren
      
      // Alle Termine löschen
      
      // Alle Daten komplett löschen (Stammdaten, Muster, Personen, Termine)
      
      // Komplette App als HTML-Datei herunterladen
      const handleDownloadAppHtml = () => {
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'aufgabenplaner.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('HTML-Datei erfolgreich heruntergeladen!', 'success');
      };

      const handleClearAllData = () => {
        if (confirm('ACHTUNG: Möchten Sie wirklich ALLE Daten (Orte, Zeitslots, Muster, Personen, Abwesenheiten und Termine) unwiderruflich löschen und auf den Neuzustand zurücksetzen?')) {
          localStorage.clear();
          setLocations(INITIAL_LOCATIONS);
          setTimeSlots(INITIAL_SLOTS);
          setPatterns(INITIAL_PATTERNS);
          setPeople(INITIAL_PEOPLE);
          setSchedule([]);
          showToast('Alle Daten wurden vollständig zurückgesetzt.', 'success');
        }
      };

      const monthNameStr = currentDate.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

      const handleClearAllSchedule = () => {
        if (confirm(`Möchten Sie wirklich alle generierten Termine für ${monthNameStr} löschen?`)) {
          setSchedule(schedule.filter(t => {
            const d = parseLocalDate(t.dateStr);
            return !(d.getFullYear() === year && d.getMonth() === month);
          }));
          showToast(`Alle Termine für ${monthNameStr} gelöscht.`, 'success');
        }

      // Alle Zuteilungen für den aktuellen Monat zurücksetzen
      const handleClearAllAssignments = () => {
        if (confirm(`Möchten Sie wirklich alle Personenzuteilungen für ${monthNameStr} zurücksetzen?`)) {
          setSchedule(schedule.map(t => {
            const d = parseLocalDate(t.dateStr);
            if (d.getFullYear() === year && d.getMonth() === month) {

            return t;
          }));
          showToast(`Zuteilungen für ${monthNameStr} zurückgesetzt.`, 'success');

      const handlePrintPdf = () => {

      };

      // Ort hinzufügen
      const handleAddLocation = (e) => {
        e.preventDefault();
        if (!newLocName.trim()) return;
        const newLoc = { id: `loc-${Date.now()}`, name: newLocName.trim() };
        setLocations([...locations, newLoc]);
        setNewLocName('');
        showToast(`Ort "${newLoc.name}" angelegt.`, 'success');
      };

      // Zeitslot hinzufügen
      const handleAddSlot = (e) => {
        e.preventDefault();
        const day = parseInt(newSlotDay, 10);
        const newSlot = { id: `slot-${Date.now()}`, dayOfWeek: day, time: newSlotTime };
        setTimeSlots([...timeSlots, newSlot]);
        showToast(`Zeitslot (${DAY_NAMES[day]} ${newSlotTime}) angelegt.`, 'success');

      // Muster hinzufügen
      const handleAddPattern = (e) => {
        e.preventDefault();

          showToast('Bitte Zeitslot und Ort auswählen.', 'error');
          return;
        }
        const newPat = { id: `pat-${Date.now()}`, slotId: newPatSlot, locationId: newPatLoc, frequency: newPatFreq, weekParity: newPatFreq === 'biweekly' ? newPatParity : null };
        setPatterns([...patterns, newPat]);
        showToast('Wiederkehrendes Muster angelegt.', 'success');
      };

      // Person hinzufügen
      const handleAddPerson = (e) => {
        e.preventDefault();
        const trimmed = newPersonName.trim();
        if (!trimmed) return;
        if (people.some(p => p.name.toLowerCase() === trimmed.toLowerCase())) {
          showToast('Person existiert bereits!', 'error');
          return;
        }
        const newPerson = {
          id: `p-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
          name: trimmed,
          absences: [],
          matrix: {},
          shiftRotation: null
        };
        setPeople([...people, newPerson]);
        setNewPersonName('');
        showToast(`Person "${trimmed}" hinzugefügt.`, 'success');
      };

      // Manuelles Hinzufügen einer Abwesenheit
      const handleAddManualAbsence = (personId, e) => {
        e.preventDefault();
        const data = manualAbsence[personId];
        if (!data || !data.start || !data.end) {
          showToast('Bitte Start- und Enddatum auswählen.', 'error');
          return;
        }
        if (data.start > data.end) {
          showToast('Startdatum darf nicht nach Enddatum liegen.', 'error');
          return;
        }

        setPeople([...people].sort((a, b) => a.name.localeCompare(b.name, 'de')).map(p => {
          if (p.id !== personId) return p;
          const absences = p.absences || [];
          const exists = absences.some(a => a.start === data.start && a.end === data.end);
          if (exists) return p;
          return {
            ...p,
            absences: [...absences, { id: `abs-${Date.now()}`, start: data.start, end: data.end, label: 'Manuell' }]
          };
        }));

        setManualAbsence({ ...manualAbsence, [personId]: { start: '', end: '' } });
        showToast('Abwesenheit manuell eingetragen.', 'success');
      };

      // PDF Import Abwesenheiten
      
      // PDF Import Abwesenheiten (Robust & fehlerfrei)
      // Abwesenheiten importieren (unterstützt PDF und DOCX via Mammoth.js)
      const handlePdfImport = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileName = file.name.toLowerCase();
        let textLines = [];

        try {
          if (fileName.endsWith('.docx')) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            textLines = result.value.split('\n').map(l => l.trim()).filter(Boolean);
          } else {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const content = await page.getTextContent();
              content.items.forEach(item => {
                const str = item.str ? item.str.trim() : '';
                if (str) textLines.push(str);
              });
            }
          }

          const monthsMap = {
            jan: '01', feb: '02', mär: '03', mar: '03', mrz: '03', apr: '04', 
            mai: '05', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', 
            okt: '10', oct: '10', nov: '11', dez: '12', dec: '12'
          };

          let currentPeople = JSON.parse(JSON.stringify(people));
          let addedCount = 0;
          let currentPersonName = null;

          textLines.forEach(line => {
            const cleanLine = line.replace(/^\|\s*/, '').trim();
            if (!cleanLine || cleanLine.includes('Gedruckt von') || cleanLine.includes('Person Abwesenheiten') || cleanLine.includes('Alle Gruppen') || cleanLine.includes('Treffpunkt') || cleanLine === 'Name' || cleanLine === 'Abwesend' || cleanLine === 'Freiberg') {
              return;
            }

            const matchedPerson = currentPeople.find(p => p.name.toLowerCase() === cleanLine.toLowerCase());
            const isNamePattern = /^[A-ZÄÖÜ][a-zäöüß]+\s+[A-ZÄÖÜ][a-zäöüß]+/.test(cleanLine) && !cleanLine.includes('2026') && !cleanLine.includes('2027') && !cleanLine.includes('-');

            if (matchedPerson || isNamePattern) {
              currentPersonName = matchedPerson ? matchedPerson.name : cleanLine;
              return;
            }

            if (!currentPersonName) return;

            // Datumsbereiche im Format z.B. "23 Nov 2026 – 27 Nov 2026" (unterstützt Bindestrich oder Geviertstrich „–“)
            const rangeRegex = /(\d{1,2})\s+([A-Za-zäÖüäöüß]{3})\s+(\d{4})\s*[–-]\s*(\d{1,2})(?:\s+([A-Za-zäÖüäöüß]{3}))?(?:\s+(\d{4}))?/gi;
            let match;

            while ((match = rangeRegex.exec(line)) !== null) {
              const d1 = match[1];
              const m1Str = match[2].toLowerCase().substring(0, 3);
              const y1 = match[3];
              const d2 = match[4];
              const m2Str = match[5] ? match[5].toLowerCase().substring(0, 3) : m1Str;
              const y2 = match[6] ? match[6] : y1;

              const sm = monthsMap[m1Str];
              const em = monthsMap[m2Str];

              if (sm && em) {
                const start = `${y1}-${sm}-${d1.padStart(2, '0')}`;
                const end = `${y2}-${em}-${d2.padStart(2, '0')}`;

                let person = currentPeople.find(p => p.name.toLowerCase() === currentPersonName.toLowerCase());
                if (!person) {
                  person = { id: `p-${Date.now()}-${Math.floor(Math.random() * 1000)}`, name: currentPersonName, absences: [], matrix: {} };
                  currentPeople.push(person);
                }

                if (!person.absences) person.absences = [];
                const exists = person.absences.some(a => a.start === start && a.end === end);
                if (!exists) {
                  person.absences.push({ id: `abs-${Date.now()}-${Math.random()}`, start, end, label: 'DOCX/PDF Import' });
                  addedCount++;
                }
              }
            }
          });

          setPeople(currentPeople);
          if (addedCount > 0) {
            showToast(`${addedCount} Abwesenheiten erfolgreich importiert!`, 'success');
          } else {
            showToast('Keine neuen Abwesenheiten erkannt.', 'error');
          }
        } catch (err) {
          console.error(err);
          showToast('Fehler beim Lesen der Datei.', 'error');
        }
      };

      const handleBackupImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.locations) setLocations(data.locations);
            if (data.timeSlots) setTimeSlots(data.timeSlots);
            if (data.patterns) setPatterns(data.patterns);
            if (data.people) setPeople(data.people);
            if (data.schedule) setSchedule(data.schedule);
            showToast('Backup erfolgreich importiert!', 'success');
          } catch (err) {
            console.error(err);
            showToast('Ungültiges Backup-Dateiformat.', 'error');
          }
        };
        reader.readAsText(file);
      };

      // Kalenderraster-Berechnung mit vollständigen Wochen (Mo-So)
      const firstDayOfMonth = new Date(year, month, 1);

          },
            h('div', { className: 'flex justify-between items-start' },

                const loc = locations.find(l => l.id === t.locationId);

            }, '+ Aufgabe')
          )

        currIter.setDate(currIter.getDate() + 1);
      }

      const selectedDayTasks = schedule.filter(t => t.dateStr === selectedDateStr);
      const selectedDayOfWeek = parseLocalDate(selectedDateStr).getDay();

      return h('div', { className: 'min-h-screen pb-12' },
        // Header
        h('header', { className: 'bg-white border-b border-slate-200 px-6 py-4 shadow-sm flex flex-wrap justify-between items-center gap-4' },
          h('div', null,
            h('h1', { className: 'text-xl font-bold text-slate-900 flex items-center gap-2' }, '🗓️ Monats- & Wochenplaner (Sachsen)',
            h('span', { className: 'text-[10px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded no-print' }, `v${APP_VERSION}`)),
            h('p', { className: 'text-xs text-slate-500' }, 'Automatische gerechte Aufgabenverteilung & Feiertagsunterstützung')
          ),
          h('nav', { className: 'flex bg-slate-100 p-1 rounded-lg gap-1 text-sm font-medium no-print' },
            h('button', { onClick: () => setActiveTab('calendar'), className: `px-3 py-1.5 rounded-md transition-all ${activeTab === 'calendar' ? 'bg-white shadow text-indigo-600 font-bold' : 'text-slate-600'}` }, '📅 Planer & Kalender'),
            h('button', { onClick: () => setActiveTab('people'), className: `px-3 py-1.5 rounded-md transition-all ${activeTab === 'people' ? 'bg-white shadow text-indigo-600 font-bold' : 'text-slate-600'}` }, '👥 Personen & Matrix'),
            h('button', { onClick: () => setActiveTab('patterns'), className: `px-3 py-1.5 rounded-md transition-all ${activeTab === 'patterns' ? 'bg-white shadow text-indigo-600 font-bold' : 'text-slate-600'}` }, '🔄 Wiederkehrende Muster'),
            h('button', { onClick: () => setActiveTab('stats'), className: `px-3 py-1.5 rounded-md transition-all ${activeTab === 'stats' ? 'bg-white shadow text-indigo-600 font-bold' : 'text-slate-600'}` }, '📊 Statistik'),
            h('button', { onClick: () => setActiveTab('settings'), className: `px-3 py-1.5 rounded-md transition-all ${activeTab === 'settings' ? 'bg-white shadow text-indigo-600 font-bold' : 'text-slate-600'}` }, '⚙️ Stammdaten & Export')
          )

        updateAvailable ? h('div', { className: 'fixed top-0 left-0 right-0 z-50 bg-amber-500 text-white text-sm font-semibold px-4 py-2 flex flex-wrap justify-center items-center gap-3 shadow-lg no-print' },
          '🔄 Eine neue Version ist verfügbar – bitte aktualisieren.',
          h('button', { onClick: () => location.reload(), className: 'px-3 py-1 bg-white text-amber-700 rounded font-bold text-xs hover:bg-amber-50' }, 'Jetzt aktualisieren')

        toast ? h('div', { className: `fixed bottom-4 right-4 z-50 px-4 py-2.5 rounded-lg shadow-lg text-white font-medium text-sm ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}` }, toast.msg) : null,

        h('main', { className: 'max-w-7xl mx-auto px-6 mt-6 print-container' },
          activeTab === 'calendar' ? h('div', { className: 'space-y-6' },
            h('div', { className: 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4 no-print' },
              h('div', { className: 'flex items-center gap-3' },
                h('button', { onClick: () => setCurrentDate(new Date(year, month - 1, 1)), className: 'p-2 border rounded-lg font-bold' }, '‹'),
                h('h2', { className: 'text-lg font-bold text-slate-800 w-44 text-center' }, currentDate.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })),
                h('button', { onClick: () => setCurrentDate(new Date(year, month + 1, 1)), className: 'p-2 border rounded-lg font-bold' }, '›')

              h('div', { className: 'flex flex-wrap gap-3 items-center' },

                h('button', { onClick: assignPeople, className: 'px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg shadow-sm' }, '2. Personen zuteilen'),

              )

            // Druckkopf für PDF Export

              h('p', { className: 'text-xs text-slate-500' }, 'Erstellt mit Monats- & Wochenplaner (Sachsen)')
            ),

              h('div', { className: 'lg:col-span-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm print:col-span-4' },
                h('div', { className: 'grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-500 mb-2' },

              h('div', { className: 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-4 no-print' },

                  h('p', { className: 'text-sm font-bold text-slate-800' }, parseLocalDate(selectedDateStr).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }))
                ),

                h('div', { className: 'space-y-3' },

                  selectedDayTasks.map(task => {

                      h('div', { className: 'flex justify-between items-center' },

                    });

                    return h('tr', { key: p.id, className: 'border-b border-slate-100 hover:bg-slate-50' },
                      h('td', { className: 'p-3 font-bold text-slate-800 border-r sticky left-0 z-10 bg-white shadow-xs' }, p.name),
                      [1, 2, 3, 4, 5, 6, 0].map(dIdx => h('td', { key: dIdx, className: 'p-3 border-r text-center font-medium text-slate-700' },
                        wDayCounts[dIdx] > 0 ? h('span', { className: 'px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded font-bold' }, wDayCounts[dIdx]) : h('span', { className: 'text-slate-300' }, '0')
                      )),
                      h('td', { className: 'p-3 text-center font-bold text-indigo-700 bg-indigo-50/50' }, total)
                    );
                  })
                )
              )
            )
          ) : h('div', { className: 'space-y-6' },
            h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
              h('div', { className: 'bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4' },
                h('h2', { className: 'text-lg font-bold text-slate-800' }, 'Standard-Orte verwalten'),
                h('form', { onSubmit: handleAddLocation, className: 'flex gap-2' },
                  h('input', {
                    type: 'text',
                    placeholder: 'Ort Name (z.B. Saal C)...',
                    value: newLocName,
                    onChange: (e) => setNewLocName(e.target.value),
                    className: 'text-xs p-2 border rounded-lg bg-white border-slate-300 flex-1'
                  }),
                  h('button', { type: 'submit', className: 'bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-lg' }, '+ Ort')
                ),
                h('div', { className: 'space-y-2' },
                  locations.map(l => h('div', { key: l.id, className: 'p-2 border rounded bg-slate-50 flex justify-between items-center text-xs' },
                    h('span', { className: 'font-bold' }, l.name),
                    h('button', { onClick: () => setLocations(locations.filter(loc => loc.id !== l.id)), className: 'text-rose-500' }, 'Löschen')
                  ))
                )
              ),

              h('div', { className: 'bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4' },
                h('h2', { className: 'text-lg font-bold text-slate-800' }, 'Zeitslots verwalten'),
                h('form', { onSubmit: handleAddSlot, className: 'flex gap-2 items-end' },
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'text-[10px] font-bold text-slate-500 block mb-1' }, 'Wochentag'),
                    h('select', {
                      value: newSlotDay,
                      onChange: (e) => setNewSlotDay(e.target.value),
                      className: 'w-full text-xs p-2 border rounded-lg bg-white border-slate-300'
                    },
                      DAY_NAMES.map((d, idx) => h('option', { key: idx, value: idx }, d))
                    )
                  ),
                  h('div', { className: 'flex-1' },
                    h('label', { className: 'text-[10px] font-bold text-slate-500 block mb-1' }, 'Uhrzeit'),
                    h('input', {
                      type: 'time',
                      value: newSlotTime,
                      onChange: (e) => setNewSlotTime(e.target.value),
                      className: 'w-full text-xs p-2 border rounded-lg bg-white border-slate-300'
                    })
                  ),
                  h('button', { type: 'submit', className: 'bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-lg h-9' }, '+ Slot')
                ),
                h('div', { className: 'space-y-2' },
                  timeSlots.map(s => h('div', { key: s.id, className: 'p-2 border rounded bg-slate-50 flex justify-between items-center text-xs' },
                    h('span', { className: 'font-bold' }, `${DAY_NAMES[s.dayOfWeek]} ${s.time} Uhr`),
                    h('button', { onClick: () => setTimeSlots(timeSlots.filter(slot => slot.id !== s.id)), className: 'text-rose-500' }, 'Löschen')
                  ))
                )
              )
            ),

            h('div', { className: 'bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4' },
              h('h2', { className: 'text-lg font-bold text-slate-800' }, 'Datensicherung & App-Export'),
              h('div', { className: 'flex flex-wrap gap-4 items-center' },
                h('button', {
                  onClick: handleDownloadAppHtml,
                  className: 'px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold text-xs shadow-sm hover:bg-indigo-700'
                }, '📥 Gesamte App (.html) herunterladen'),
                h('button', {
                  onClick: () => {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ locations, timeSlots, patterns, people, schedule }));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", "aufgabenplaner_backup.json");
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                  },
                  className: 'px-4 py-2 bg-slate-700 text-white rounded-lg font-bold text-xs shadow-sm hover:bg-slate-800'
                }, 'Backup Exportieren (JSON)'),
                h('label', { className: 'cursor-pointer px-4 py-2 bg-slate-800 text-white rounded-lg font-bold text-xs shadow-sm hover:bg-slate-900' },
                  'Backup Importieren (JSON)',
                  h('input', { type: 'file', accept: 'application/json', onChange: handleBackupImport, className: 'hidden' })
                )
              )
            ),
            h('div', { className: 'bg-white p-6 rounded-xl border border-rose-200 bg-rose-50/20 shadow-sm space-y-4' },
              h('h2', { className: 'text-lg font-bold text-rose-800' }, 'Gefahrenzone'),
              h('p', { className: 'text-xs text-rose-600' }, 'Setzt die gesamte Anwendung inklusive aller gespeicherten Orte, Zeitslots, Personen und Termine komplett zurück.'),
              h('button', {
                onClick: handleClearAllData,
                className: 'px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-lg shadow-sm'
              }, '⚠️ Alle Anwendungsdaten komplett löschen')
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root') || document.document.getElementById('root'));
    // Wait, document.document.getElementById('root') is correct. Let's fix that typo.
    root.render(h(App));
  </script>
</body>
</html>
